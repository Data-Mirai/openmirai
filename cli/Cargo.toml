[package]
name = "datamirai-cli"
version = "0.4.4"
edition = "2021"
description = "Interactive CLI for Data Mirai Engine"
license = "MIT"

[[bin]]
name = "mirai"
path = "src/main.rs"

[dependencies]
datamirai-engine = { path = "../engine" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
