name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build metadata (timestamp)
        shell: bash
        run: echo "MIRAI_BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build release binary
        env:
          MIRAI_BUILD_NUMBER: ${{ github.run_number }}
        run: cargo build --release --target ${{ matrix.target }} --bin mirai

      - name: Prepare artifact (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"   # fuente única de la versión
          NAME="mirai-v${VER}+build.${{ github.run_number }}-${{ matrix.platform }}"
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/mirai" "artifacts/${NAME}"
          chmod +x "artifacts/${NAME}"

      - name: Prepare artifact (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          NAME="mirai-v${VER}+build.${{ github.run_number }}-${{ matrix.platform }}.exe"
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/mirai.exe" "artifacts/${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Pre-built `mirai` binaries for macOS (arm64, x86_64), Linux (x86_64, arm64), and Windows (x86_64).

            Verify integrity with `SHA256SUMS`.

            See [CHANGELOG.md](https://github.com/Gabo-TheCreator/openmirai/blob/main/CHANGELOG.md) for release notes.
