# TEST-207 / TEST-208 — a node whose only exits are conditional.
#
# With strict_completion the graph is rejected at load time: if neither
# condition matches, the run dies where nobody declared an end.
# Drop the flag (TEST-208) and it loads and runs exactly as it always did.

name: strict-207-conditional-dead-end
version: v1

graph:
  strict_completion: true
  nodes:
    - id: trigger
      tool_type: trigger/manual
      config:
        payload:
          score: 5

    - id: route
      tool_type: logic/merge
      config: {}

    - id: high
      tool_type: output/response
      config:
        message: "high"

    - id: low
      tool_type: output/response
      config:
        message: "low"

  edges:
    - source: trigger
      target: route
    - source: route
      target: high
      condition:
        field: score
        op: greater_than
        value: 100
    - source: route
      target: low
      condition:
        field: score
        op: less_than
        value: 0
