# Flujo 02 — Ruteo condicional
#
# Qué prueba en la nube: que la decisión de camino ocurre DENTRO del motor y no
# en el cliente. El caller manda datos; el grafo elige la rama. El smoke lo
# ejecuta dos veces con entradas distintas y verifica que la traza contiene una
# rama y no la otra.
#
# Contra v0.6.0 este flujo ruteaba con un nodo bash porque `logic/condition`
# era inusable: declaraba su comparando como objeto y rechazaba cualquier
# string. En 0.7.0 quedó arreglado —`value` es FieldType::Any y el operador
# acepta tanto `equals` como `eq`—, así que vuelve a usar el nodo real.
#
# La semántica del nodo, que no es obvia: el input `field` NO es el nombre de
# un campo sino el VALOR a evaluar, y llega por data_map. El operador y el
# comparando son config estática del nodo.

name: 02-ruteo-condicional
version: v1
description: "Enruta a la rama urgente o normal según la entrada recibida"

inputs:
  prioridad:
    type: text
    required: true
    description: "alta | baja"

graph:
  nodes:
    - id: trigger
      tool_type: trigger/manual

    - id: evaluar
      tool_type: logic/condition
      config:
        operator: equals
        value: "alta"

    - id: rama_urgente
      tool_type: output/response
      config:
        message: "ruta-urgente"

    - id: rama_normal
      tool_type: output/response
      config:
        message: "ruta-normal"

  edges:
    - source: trigger
      target: evaluar
      data_map:
        field: "trigger.payload.prioridad"

    # Primera arista cuya condición matchea gana (ruteo exclusivo).
    - source: evaluar
      target: rama_urgente
      condition:
        field: result
        op: equals
        value: true

    # Arista sin condición: fallback cuando ninguna condición matchea.
    - source: evaluar
      target: rama_normal
