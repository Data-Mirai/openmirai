name: "Structured Output Demo"
version: v1
agent_type: managed

graph:
  nodes:
    - id: trigger
      tool_type: trigger/webhook
      config:
        payload:
          transcript: |
            Juan: Buenos días a todos. Hoy vamos a revisar el sprint.
            María: El backend está listo, faltan los tests.
            Carlos: Yo me encargo de los tests esta semana.
            Juan: Perfecto. María, prepara el deploy para el viernes.
            María: Listo, lo tengo.

    - id: extract
      tool_type: ai/llm_call
      config:
        model: gemma4
        prompt: "Extrae los insights de esta transcripción de reunión."
        temperature: 0.3
        max_tokens: 1024
        output_schema: |
          {
            "type": "object",
            "properties": {
              "title": {"type": "string"},
              "participants": {"type": "array", "items": {"type": "string"}},
              "action_items": {"type": "array", "items": {"type": "string"}},
              "summary": {"type": "string"}
            },
            "required": ["title", "participants", "action_items", "summary"]
          }
        schema_retries: 2

  edges:
    - id: e1
      source: trigger
      target: extract
      data_map:
        meeting_transcript: "trigger.body"
