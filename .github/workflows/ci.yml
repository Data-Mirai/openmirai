name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-rust:
    name: Rust Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Check
        run: cargo check --workspace

      - name: Run Cargo Tests
        run: cargo test --workspace

      - name: Build Binary for Integration Tests
        run: cargo build

      - name: Run CLI Integration Script
        run: bash test/run_all.sh

      - name: Run HTTP Server E2E Tests
        run: bash test/e2e_server.sh

  test-python-sdk:
    name: Python SDK E2E Verification
    runs-on: ubuntu-latest
    needs: test-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-level: "3.10"
          cache: "pip"

      - name: Install Python SDK dependencies
        run: |
          pip install -e sdks/python

      - name: Build Rust Binary for SDK
        run: cargo build

      - name: Run Python SDK E2E Tests
        run: |
          cd sdks/python
          python3 test_sdk.py

  test-typescript-sdk:
    name: TypeScript SDK E2E Verification
    runs-on: ubuntu-latest
    needs: test-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node.js dependencies
        run: |
          cd sdks/typescript
          # Generate package-lock if not present, then install
          npm install

      - name: Build Rust Binary for SDK
        run: cargo build

      - name: Run TypeScript SDK E2E Tests
        run: |
          cd sdks/typescript
          # Run tests with vitest
          npm run test -- --run
