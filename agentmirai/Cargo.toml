[package]
name = "agentmirai"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
description = "AgentMirai — the command-center layer (sessions, fleet SoT, HTTP orchestration) over the OpenMirai engine"
license = "MIT"

[lib]
name = "agentmirai"
path = "src/lib.rs"

[dependencies]
openmirai-engine = { path = "../engine", features = ["server", "builtin-tools"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
regex = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
url = "2"

# HTTP API server (axum + SSE).
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
