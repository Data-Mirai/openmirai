[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamirai-engine"
version = "0.1.0"
description = "Open source engine for executing agentic graphs"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Data Mirai" }]
keywords = ["agents", "graphs", "llm", "workflow", "engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

# Core dependencies
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Server mode: `pip install datamirai-engine[server]`
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Postgres persistence: `pip install datamirai-engine[postgres]`
postgres = [
    "asyncpg>=0.30",
]
# Browser mode (Playwright): `pip install datamirai-engine[browser]`
browser = [
    "playwright>=1.40",
]
# Full install: `pip install datamirai-engine[all]`
all = [
    "datamirai-engine[server]",
    "datamirai-engine[postgres]",
    "datamirai-engine[browser]",
]
# Dev tools
dev = [
    "datamirai-engine[server]",
    "datamirai-engine[postgres]",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "httpx>=0.27",
]

[project.scripts]
datamirai = "datamirai_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datamirai_engine"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["datamirai_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
