# TEST-212 — `on_failure: route_to_error` with no error edge to route to.
#
# The error goes into the node's output, no edge matches it, and the cursor
# dies with the failure sitting in the state. With the flag the run fails and
# says so, carrying the original cause.

name: strict-212-route-to-error-without-edge
version: v1

graph:
  strict_completion: true
  nodes:
    - id: trigger
      tool_type: trigger/manual
      config:
        payload:
          task: "save it"

    - id: save
      tool_type: filesystem/read_file
      config:
        path: /nonexistent/openmirai/strict-completion/no-such-file.txt
        retry_policy:
          max_retries: 0
          backoff: none
          initial_delay_secs: 0.0
          on_failure: route_to_error

  edges:
    - source: trigger
      target: save
