<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenMirai — Studio (visualizador local)</title>
<style>
/* ============================================================
   OpenMirai · Studio — visualizador local multi-agente.
   Lee agentes .yaml REALES (js-yaml embebido). Offline, doble-click.
   Catalogo default = agents/ + examples/ del repo. Abre cualquier .yaml.
   ============================================================ */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#f5f6f5; --surface:#fff; --surface-2:#f3f4f3; --surface-3:#ecedeb;
  --border:#e6e7e4; --border-2:#dadbd7; --border-strong:#c7c8c3;
  --text:#1b1c1a; --text-2:#62645f; --text-3:#94968f; --text-on-accent:#fff;
  --accent:#0e9f6e; --accent-hover:#0c8c61; --accent-press:#0a7853;
  --accent-soft:#e8f6f0; --accent-soft-2:#d6efe4; --accent-border:#aee0cc; --accent-text:#0a6f4d;
  --run:#c2880f; --run-soft:#fbf0d7; --run-border:#ecd49a; --run-text:#8a5e07;
  --err:#d23b54; --err-soft:#fbe8eb; --err-border:#f0bcc5; --err-text:#a32338;
  --canvas-bg:#f7f8f7; --canvas-dot:#d8dad6; --edge:#b9bcb6; --edge-strong:#8d908a;
  --r-4:4px; --r-6:6px; --r-8:8px; --r-10:10px; --r-12:12px; --r-16:16px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,28,24,.05);
  --sh-2:0 1px 2px rgba(20,28,24,.06),0 2px 6px rgba(20,28,24,.05);
  --sh-pop:0 16px 48px rgba(20,28,24,.16),0 4px 12px rgba(20,28,24,.08),0 0 0 1px rgba(20,28,24,.04);
  --sh-node:0 1px 2px rgba(20,28,24,.07),0 2px 8px rgba(20,28,24,.06);
  --focus-ring:0 0 0 3px rgba(14,159,110,.22);
}
[data-theme="dark"]{
  --bg:#0e100f; --surface:#17191a; --surface-2:#1d201f; --surface-3:#24302a;
  --border:#272a28; --border-2:#323634; --border-strong:#3d423f;
  --text:#ecedea; --text-2:#9aa09a; --text-3:#666c66; --text-on-accent:#06140d;
  --accent:#22b885; --accent-hover:#34c594; --accent-press:#1aa276;
  --accent-soft:#11271f; --accent-soft-2:#163528; --accent-border:#1e5c44; --accent-text:#5fd6a9;
  --run:#dca22e; --run-soft:#2a2310; --run-border:#574818; --run-text:#e6bc5e;
  --err:#e5566d; --err-soft:#2a1418; --err-border:#5e2730; --err-text:#f08a9a;
  --canvas-bg:#121414; --canvas-dot:#262a28; --edge:#3a403c; --edge-strong:#5a625c;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3);
  --sh-pop:0 16px 48px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);
  --sh-node:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --focus-ring:0 0 0 3px rgba(34,184,133,.28);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);font-size:13px;font-weight:550;line-height:1;letter-spacing:-.1px;cursor:pointer;border-radius:var(--r-8);padding:0 12px;height:32px;border:1px solid transparent;white-space:nowrap;user-select:none;transition:background .14s,border-color .14s,box-shadow .14s,color .14s,transform .06s}
.btn:active{transform:translateY(.5px)}
.btn svg{flex:0 0 auto}
.btn.primary{background:var(--accent);color:var(--text-on-accent);box-shadow:0 1px 2px rgba(10,120,83,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border-2);box-shadow:var(--sh-1)}
.btn.secondary:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.ghost{background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{background:var(--surface);color:var(--err-text);border-color:var(--err-border)}
.btn.danger:hover{background:var(--err-soft)}
.btn.big{height:38px;padding:0 16px;font-size:13.5px}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r-8);border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;transition:background .14s,color .14s,border-color .14s}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-8);padding:3px;gap:2px}
.seg button{font-family:var(--font-sans);font-size:12.5px;font-weight:550;letter-spacing:-.1px;border:none;background:transparent;color:var(--text-2);cursor:pointer;padding:5px 12px;border-radius:var(--r-6);display:inline-flex;align-items:center;gap:6px;transition:background .14s,color .14s,box-shadow .14s}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.ok{background:var(--accent)} .dot.run{background:var(--run)} .dot.err{background:var(--err)} .dot.off{background:var(--border-strong)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.2px;padding:3px 8px;border-radius:var(--r-full);border:1px solid transparent;text-transform:uppercase;line-height:1}
.badge.accent{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-border)}
.tag{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:var(--r-4);background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.input{font-family:var(--font-sans);font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-8);padding:8px 10px;height:34px;width:100%;box-shadow:var(--sh-1);transition:border-color .14s,box-shadow .14s}
.input.mono{font-family:var(--font-mono);font-size:12.5px}
.label{font-size:11px;font-weight:600;color:var(--text-2)}
/* shell */
.shell{display:flex;height:100vh}
.sidenav{width:216px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 1px 2px rgba(10,120,83,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-8);color:var(--text-2);font-size:13px;font-weight:550;cursor:pointer;margin-bottom:2px;transition:background .12s,color .12s}
.navitem:hover{background:var(--surface-2);color:var(--text)}
.navitem.active{background:var(--accent-soft);color:var(--accent-text)}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-8);color:var(--text);font-size:12.5px;font-weight:550;cursor:pointer;border:1px solid var(--border-2);background:var(--surface);width:100%;margin-top:6px;box-shadow:var(--sh-1)}
.navbtn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.nav-grp{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.9px;color:var(--text-3);padding:16px 10px 7px}
.content{flex:1;overflow:auto;background:var(--bg)}
.page{max-width:1120px;margin:0 auto;padding:32px 36px 72px}
.page-h{font-size:23px;font-weight:680;letter-spacing:-.5px;margin:0 0 3px}
.page-sub{font-size:13.5px;color:var(--text-2);margin:0 0 22px}
.page-sub code{font-family:var(--font-mono);font-size:12px}
.section-h{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);margin:28px 0 13px;font-family:var(--font-mono);display:flex;align-items:center;gap:8px}
.section-h .cnt{color:var(--text-3);opacity:.7}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:8px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);padding:15px 16px;box-shadow:var(--sh-1)}
.tile-k{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.tile-v{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:6px;line-height:1}
.tile-v small{font-size:13px;font-weight:600;color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);padding:16px;cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .07s;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.card:hover{border-color:var(--border-strong);box-shadow:var(--sh-2);transform:translateY(-1px)}
.card-rail{position:absolute;left:0;top:0;bottom:0;width:3px}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.card-ico{width:38px;height:38px;border-radius:var(--r-10);border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.card-title{font-size:14.5px;font-weight:640;letter-spacing:-.2px}
.card-id{font-family:var(--font-mono);font-size:11px;color:var(--text-3);margin-top:1px}
.card-desc{font-size:12.5px;color:var(--text-2);line-height:1.5;margin-bottom:13px;min-height:38px}
.card-meta{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--text-3);font-family:var(--font-mono)}
.card-meta .mi{display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-size:12px;font-weight:550;padding:5px 12px;border-radius:var(--r-full);border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.empty{padding:26px;border:1px dashed var(--border-2);border-radius:var(--r-10);color:var(--text-3);font-size:12.5px;text-align:center;line-height:1.6}
.empty code{font-family:var(--font-mono);color:var(--text-2)}
.dh{display:flex;align-items:flex-start;gap:16px;margin-bottom:2px}
.dh-ico{width:56px;height:56px;border-radius:var(--r-12);border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.dh-actions{display:flex;gap:9px;margin-left:auto;flex:0 0 auto}
.pathbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 2px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-8)}
.pathbar code.ppath{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);word-break:break-all;flex:1;min-width:140px}
.pathbar .ext-note{font-size:11px;color:var(--text-3);flex:1}
.metabar{display:flex;gap:26px;padding:15px 0 6px;flex-wrap:wrap}
.metabar .mb{display:flex;flex-direction:column;gap:3px}
.metabar .mb-k{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3)}
.metabar .mb-v{font-size:14px;font-weight:600;font-family:var(--font-mono)}
.flowmini{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:14px;border:1px solid var(--border);border-radius:var(--r-10);background:var(--surface);box-shadow:var(--sh-1)}
.fm-node{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--r-8);border:1px solid;font-family:var(--font-mono);font-size:11.5px;font-weight:550}
.fm-arrow{color:var(--text-3)}
.rtable{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:var(--r-10);overflow:hidden}
.rtable th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);font-family:var(--font-mono)}
.rtable td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-2)}
.rtable tr:last-child td{border-bottom:none}
.rtable tbody tr[data-goto]{cursor:pointer;transition:background .12s}
.rtable tbody tr[data-goto]:hover{background:var(--surface-2)}
.wf-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.wf-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-sans);font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-full);border:1px solid transparent;line-height:1}
.cfg-box{border:1px solid var(--border);border-radius:var(--r-8);overflow:hidden}
.cfg-row{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.cfg-row:last-child{border-bottom:none}
.cfg-k{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);min-width:74px;flex:0 0 auto;padding-top:1px}
.cfg-v{font-family:var(--font-mono);font-size:11px;color:var(--text);text-align:right;flex:1;word-break:break-word}
/* paso a paso (workflow detail) */
.steps{display:flex;flex-direction:column;gap:11px}
.step{display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);padding:14px 15px;box-shadow:var(--sh-1)}
.step-n{width:26px;height:26px;border-radius:var(--r-full);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;color:#fff}
.step-body{flex:1;min-width:0}
.step-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.step-ico{width:26px;height:26px;border-radius:var(--r-8);border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.step-id{font-family:var(--font-mono);font-size:12.5px;font-weight:650;color:var(--text)}
.step-cat{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:var(--r-4);border:1px solid}
.step-tool{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);margin-left:auto}
.step-does{font-size:12.5px;color:var(--text-2);line-height:1.5;margin:0 0 8px}
.step-cfg{display:flex;flex-wrap:wrap;gap:6px}
.step-kv{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;padding:3px 8px;border-radius:var(--r-6);background:var(--surface-2);border:1px solid var(--border)}
.step-kv b{color:var(--text);font-weight:600}
.step-kv .kk{color:var(--text-3)}
/* workflow-en-agente (identity view) */
.wfrow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);padding:15px 16px;box-shadow:var(--sh-1);cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .07s}
.wfrow:hover{border-color:var(--border-strong);box-shadow:var(--sh-2);transform:translateY(-1px)}
.wfrow-top{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.wfrow-ico{width:34px;height:34px;border-radius:var(--r-10);border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.wfrow-models{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.model-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-full);border:1px solid var(--accent-border);background:var(--accent-soft);color:var(--accent-text)}
.model-pill.muted{border-color:var(--border-2);background:var(--surface-2);color:var(--text-3)}
.flowmini.wrap{flex-wrap:wrap;row-gap:9px}
.yamlview{position:absolute;inset:0;background:var(--surface);display:none;flex-direction:column;z-index:6}
.yaml-head{height:40px;flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.yaml-pre{flex:1;margin:0;overflow:auto;padding:16px 20px;font-family:var(--font-mono);font-size:12.5px;line-height:1.65;color:var(--text);background:var(--canvas-bg);white-space:pre;tab-size:2}
.y-k{color:var(--accent-text);font-weight:600} .y-s{color:#3b78d6} .y-n{color:#b08534} .y-c{color:var(--text-3);font-style:italic} .y-a{color:var(--accent);font-weight:700}
[data-theme="dark"] .y-s{color:#79b0f5}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{display:flex;align-items:flex-start;gap:11px;width:340px;padding:12px 13px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-12);box-shadow:var(--sh-pop)}
.toast-ico{width:28px;height:28px;border-radius:var(--r-8);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--accent-border)}
.spin{animation:rot .8s linear infinite;transform-origin:center}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-16}}
/* editor */
.editor{display:flex;flex-direction:column;height:100vh}
.toolbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
.tdiv{width:1px;height:22px;background:var(--border);margin:0 4px}
.fname{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:12.5px;color:var(--text-2)}
.statusbar{height:30px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;font-size:11.5px;color:var(--text-2)}
.statusbar .grow{flex:1}
.brandmark{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.8px;color:var(--text-3);font-weight:600}
.emain{flex:1;display:flex;min-height:0}
.palette{width:230px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.pal-search{padding:12px 12px 10px;position:relative}
.pal-search svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.pal-search .input{padding-left:30px;height:32px}
.pal-groups{flex:1;overflow:auto;padding:0 8px}
.pal-grp{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--text-3);padding:14px 8px 6px}
.pal-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-8);cursor:grab;transition:background .12s}
.pal-row:hover{background:var(--surface-2)}
.pal-ico{width:26px;height:26px;border-radius:var(--r-6);border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.canvaswrap{flex:1;position:relative;min-width:0}
.inspector{width:300px;flex:0 0 auto;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column}
.insp-head{padding:13px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.insp-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.insp-foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.insp-ico{width:32px;height:32px;border-radius:var(--r-8);border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.zoomctl{position:absolute;bottom:14px;right:16px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-10);box-shadow:var(--sh-2);padding:3px;z-index:4}
.zoomctl .iconbtn{width:28px;height:28px}
.minimap{position:absolute;bottom:14px;left:16px;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-full);box-shadow:var(--sh-1);padding:5px 11px 5px 9px;z-index:4;font-size:11px;color:var(--text-3)}
.canvas{position:absolute;inset:0;overflow:hidden;background-color:var(--canvas-bg);background-image:radial-gradient(var(--canvas-dot) 1.3px,transparent 1.3px);background-size:22px 22px;background-position:-1px -1px}
.graph{position:absolute;left:0;top:0;transform-origin:top left}
.graph-edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edge-label{font-family:var(--font-mono);font-size:9px;fill:var(--text-3);paint-order:stroke;stroke:var(--canvas-bg);stroke-width:3px;font-weight:600}
.stage-label{position:absolute;top:0;width:232px;text-align:center;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.node{position:absolute;width:232px;background:var(--surface);border-radius:var(--r-10);box-shadow:var(--sh-node),inset 0 0 0 1px var(--border-2);transition:box-shadow .2s}
.node.state-running{box-shadow:var(--sh-node),0 0 0 1px var(--run-border),0 0 0 4px color-mix(in srgb,var(--run) 18%,transparent),inset 0 0 0 1px var(--border-2)}
.node.state-done{box-shadow:var(--sh-node),0 0 0 1px var(--accent-border),inset 0 0 0 1px var(--border-2)}
.node.selected{box-shadow:0 0 0 2px var(--accent),0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
.node-head{min-height:46px;display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-10) var(--r-10) 0 0;border-bottom:1px solid var(--border);position:relative}
.node-rail{position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0}
.node-ico{width:28px;height:28px;border-radius:var(--r-8);border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.node-id{font-family:var(--font-mono);font-size:12.5px;font-weight:650;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-tool{font-family:var(--font-mono);font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-grp{font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.8px;color:var(--text-3);display:flex;align-items:center;gap:7px;padding:7px 12px 4px}
.node-grp::after{content:"";flex:1;height:1px;background:var(--border)}
.node-row{position:relative;display:flex;align-items:center;gap:8px;height:27px}
.node-row.in{padding:0 12px 0 13px} .node-row.out{padding:0 13px 0 12px}
.node-name{font-family:var(--font-mono);font-size:11px;color:var(--text);white-space:nowrap;flex:0 0 auto}
.node-spacer{flex:1;min-width:8px}
.type{font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.3px;padding:1px 5px;border-radius:var(--r-4);border:1px solid;flex:0 0 auto;text-transform:uppercase}
.port{position:absolute;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-1);z-index:3}
.port.l{left:-6px} .port.r{right:-6px}
.node-status{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.node-status.done{background:var(--accent);color:var(--text-on-accent)}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidenav">
    <div class="brand">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 4.5L12.5 9L5 13.5" stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="4.5" r="2.1" fill="#fff"/><circle cx="5" cy="13.5" r="2.1" fill="#fff"/><circle cx="13" cy="9" r="2.4" fill="#fff"/></svg></span>
      <div><div style="font-size:14px;font-weight:680;letter-spacing:-.3px">OpenMirai</div><div style="font-size:10.5px;color:var(--text-3);font-family:var(--font-mono);letter-spacing:.5px">STUDIO</div></div>
    </div>
    <a class="navitem" id="navHome" href="#/"></a>
    <div class="nav-grp">DATA MIRAI</div>
    <a class="navitem" id="navWorkflows" href="#/workflows"></a>
    <a class="navitem" id="navAgentsView" href="#/agents"></a>
    <a class="navitem" id="navObs" href="#/observability"></a>
    <button class="navbtn" id="openAgentBtn"><span data-ico="upload"></span>Abrir workflow…</button>
    <input type="file" id="filePick" accept=".yaml,.yml" multiple style="display:none"/>
    <div class="nav-grp">CUENTA</div>
    <div class="navitem" id="navTheme"></div>
    <span style="flex:1"></span>
    <div class="brandmark" style="padding:8px 10px">OPENMIRAI · DATA MIRAI</div>
  </aside>
  <main class="content" id="content"></main>
</div>
<div class="editor" id="editor" style="display:none">
  <div class="toolbar">
    <button class="iconbtn" id="edBack" title="Volver"><span data-ico="back"></span></button>
    <span class="fname" id="edFname"></span>
    <span class="seg" id="modeSeg" style="margin-left:12px">
      <button data-mode="Visual" class="active"><span data-ico="layers"></span>Visual</button>
      <button data-mode="YAML"><span data-ico="code"></span>YAML</button>
    </span>
    <span style="flex:1"></span>
    <button class="iconbtn" title="Ajustar" id="fitBtn"><span data-ico="fit"></span></button>
    <button class="btn secondary"><span data-ico="check"></span>Compile</button>
    <span class="tdiv"></span>
    <button class="iconbtn" id="edTheme" title="Tema"><span data-ico="moon"></span></button>
    <button class="btn primary" id="edRun" style="margin-left:2px"><span data-ico="run" data-fill="1"></span>Run</button>
  </div>
  <div class="statusbar">
    <span style="display:inline-flex;align-items:center;gap:7px"><span class="dot ok"></span>Grafo valido</span>
    <span class="grow"></span>
    <span class="brandmark" id="edPath"></span>
  </div>
  <div class="emain">
    <aside class="palette">
      <div class="pal-search"><span data-ico="search"></span><input class="input" placeholder="Buscar herramientas"/></div>
      <div class="pal-groups" id="palGroups"></div>
    </aside>
    <div class="canvaswrap">
      <div class="canvas" id="canvas"><div class="graph" id="graph"></div></div>
      <div class="minimap"><span data-ico="layers"></span><span id="nodeCount"></span></div>
      <div class="zoomctl">
        <button class="iconbtn" id="zoomOut" title="Alejar"><span data-ico="minus"></span></button>
        <span id="zoomLabel" style="font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);padding:0 6px;min-width:42px;text-align:center">100%</span>
        <button class="iconbtn" id="zoomIn" title="Acercar"><span data-ico="plus"></span></button>
        <span style="width:1px;height:18px;background:var(--border);margin:0 2px"></span>
        <button class="iconbtn" id="fitBtn2" title="Ajustar"><span data-ico="fit"></span></button>
      </div>
      <div class="yamlview" id="yamlView">
        <div class="yaml-head"><span data-ico="code" style="color:var(--text-3)"></span><span id="yamlName" style="font-family:var(--font-mono);font-size:12px;color:var(--text-2)"></span><span class="badge accent" style="margin-left:6px">archivo real</span><span style="flex:1"></span><button class="btn secondary" id="copyYaml"><span data-ico="copy"></span>Copy</button></div>
        <pre class="yaml-pre" id="yamlPre"></pre>
      </div>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>window.MIRAI_DEFAULT_SOURCES=[{"id":"back-to-my-center","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/back-to-my-center.yaml","relpath":"agents/back-to-my-center.yaml","source":"agents","mtimeMin":12076,"yaml":"# Back to My Center — Idea-dump → clasificación → borrador de nota (loop del centro de mando)\n#\n# Recibe un TEXTO CRUDO (un volcado de idea/tarea de Gabriel) y produce:\n#   1) una CLASIFICACIÓN estructurada (proyecto/tag destino, tipo, prioridad, próximo paso)\n#      -> hecha con un modelo RÁPIDO y BARATO (gemini-2.5-flash-lite): es una tarea de rutina.\n#   2) un BORRADOR DE NOTA corto en Markdown (listo para caer en INBOX.md / output/)\n#      -> hecho con un modelo FUERTE (gemini-2.5-pro): la síntesis se gana el modelo caro.\n#\n# ESTO ES LA PRUEBA MULTIMODELO: dos nodos ai/llm_call en el MISMO grafo con `model` DISTINTO\n# por nodo. El engine inyecta el string `model` literal en la URL de la API del proveedor activo\n# (ver engine/src/llm/gemini.rs:502), así que el modelo se elige por-PASO sin cambiar de proveedor.\n#\n# Run (pídele la key a Gabriel — NO leer .env):\n#   mirai run agents/back-to-my-center.yaml --provider gemini --api-key $GOOGLE_API_KEY \\\n#     --input '{\"idea\": \"Hay que blindar el cobro de Athens antes de facturar, atribución anti-fuga\"}'\n#\n#   # con ruta de nota propia:\n#   mirai run agents/back-to-my-center.yaml --provider gemini --api-key $GOOGLE_API_KEY \\\n#     --input '{\"idea\": \"...\", \"nota_path\": \"workspace/centro/output/2026-07-18-idea.md\"}'\n#\n# Validar sin correr (no requiere key):\n#   mirai validate agents/back-to-my-center.yaml\n\nname: back-to-my-center\nversion: v1\ndescription: \"Loop del centro: recibe un idea-dump crudo, lo clasifica (modelo rápido) y destila un borrador de nota (modelo fuerte). Ejercita el patrón multimodelo por-nodo.\"\n\ninputs:\n  idea:\n    type: text\n    required: true\n    description: \"El texto crudo volcado por Gabriel (idea, tarea o pensamiento sin procesar)\"\n  nota_path:\n    type: text\n    required: false\n    default: \"notes/back-to-my-center-nota.md\"\n    description: \"Ruta del borrador de nota Markdown a generar (se crea la carpeta si no existe)\"\n\noutputs:\n  clasificacion:\n    type: json\n    description: \"Clasificación estructurada: proyecto/tag, tipo, prioridad, próximo paso\"\n  nota_guardada_en:\n    type: text\n    description: \"Ruta del borrador de nota generado\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # PASO 1 — CLASIFICAR. Tarea de rutina, alto volumen -> MODELO RÁPIDO/BARATO.\n    # Devuelve JSON validado contra un esquema (el engine reintenta si no cumple).\n    - id: clasificar\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-flash-lite\n        system_prompt: |\n          Eres el clasificador del centro de mando de Gabriel (back-to-my-center),\n          su hub para volcar ideas de todos sus proyectos y convertirlas en tareas.\n          Trabajas SIEMPRE en español, directo, sin relleno. Tu único trabajo es\n          clasificar el texto crudo que recibes: NO redactes la nota, solo etiquétala.\n        prompt: |\n          Clasifica el idea-dump que viene en el contexto de sesión. Elige el `proyecto`\n          de EXACTAMENTE esta lista (el tag del tablero); si nada encaja, usa \"centro\":\n            athens, sapilabs, datamirai, timeless, herramientas, centro, personal,\n            parqueaderos, startup-life, libros, legal.\n          `tipo` = uno de: tarea | reporte | idea.\n          `prioridad` = uno de: alta | media | baja.\n          `proximo_paso` = el siguiente paso ejecutable de valor (0→1), en una frase.\n          `titulo` = un título corto (≤8 palabras) para la nota.\n          Devuelve SOLO el JSON del esquema, sin texto antes ni después.\n        temperature: 0.0\n        max_tokens: 400\n        output_schema: |\n          {\n            \"type\": \"object\",\n            \"properties\": {\n              \"proyecto\": {\"type\": \"string\"},\n              \"tipo\": {\"type\": \"string\", \"enum\": [\"tarea\", \"reporte\", \"idea\"]},\n              \"prioridad\": {\"type\": \"string\", \"enum\": [\"alta\", \"media\", \"baja\"]},\n              \"titulo\": {\"type\": \"string\"},\n              \"proximo_paso\": {\"type\": \"string\"}\n            },\n            \"required\": [\"proyecto\", \"tipo\", \"prioridad\", \"titulo\", \"proximo_paso\"]\n          }\n        schema_retries: 2\n\n    # PASO 2 — DESTILAR. Síntesis de valor permanente -> MODELO FUERTE.\n    # Recibe por fan-in tanto la idea cruda (context) como la clasificación (clasif).\n    - id: destilar\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        system_prompt: |\n          Eres el redactor senior del centro de mando de Gabriel. Trabajas SIEMPRE en\n          español, tono directo y ejecutivo, bullet-first, sin walls of text ni paja.\n          Tu fuente de verdad es EXCLUSIVAMENTE la idea cruda y su clasificación: no\n          inventes datos, nombres ni fechas que no aparezcan. Norte del centro: 0→1\n          ejecutable sobre la visión (back to basics).\n        prompt: |\n          En el contexto de sesión recibes dos piezas:\n            - idea_cruda -> el volcado original de Gabriel, sin procesar.\n            - clasif     -> la clasificación en JSON (proyecto, tipo, prioridad, título, próximo paso).\n\n          Redacta un BORRADOR DE NOTA corto y accionable en ESPAÑOL. Devuelve ÚNICAMENTE\n          Markdown válido, sin texto antes ni después, con esta estructura exacta:\n\n          # {título de la clasificación}\n\n          > Proyecto: {proyecto} · Tipo: {tipo} · Prioridad: {prioridad}\n\n          ## Qué es\n          - 1 a 3 bullets que capturan la idea en limpio (qué quiso decir Gabriel).\n\n          ## Próximo paso (0→1)\n          - El siguiente paso ejecutable de valor (usa `proximo_paso` de la clasificación y afínalo).\n\n          ## Contexto / notas\n          - Bullets con matices, dudas abiertas o dependencias que aparezcan en la idea cruda.\n            Si no hay, escribe \"- (sin contexto adicional en el volcado)\".\n\n          Reglas: no rellenes; si algo no está en la idea cruda, no lo inventes. Bullet-first.\n        temperature: 0.4\n        max_tokens: 1200\n\n    # PASO 3 — Guardar el borrador en disco (ruta por data_map, no config).\n    - id: guardar\n      tool_type: filesystem/write_file\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    # La idea cruda entra al clasificador como contexto de sesión.\n    - source: start\n      target: clasificar\n      data_map:\n        context: \"start.payload.idea\"\n\n    # Fan-in a `destilar`: llega TANTO la clasificación (nodo 1) COMO la idea cruda (trigger).\n    # El engine une el data_map de todas las aristas entrantes, así que `destilar` ve ambas.\n    - source: clasificar\n      target: destilar\n      data_map:\n        clasif: \"clasificar.response\"\n\n    - source: start\n      target: destilar\n      data_map:\n        idea_cruda: \"start.payload.idea\"\n\n    # El borrador redactado se escribe a disco en `nota_path`.\n    - source: destilar\n      target: guardar\n      data_map:\n        content: \"destilar.response\"\n        path: \"start.payload.nota_path\"\n\n    # Salida final: dónde quedó la nota + la clasificación estructurada.\n    - source: guardar\n      target: respond\n      data_map:\n        nota_guardada_en: \"guardar.path\"\n        clasificacion: \"clasificar.structured_output\"\n"},{"id":"doc-qa","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/doc-qa.yaml","relpath":"agents/doc-qa.yaml","source":"agents","mtimeMin":17166,"yaml":"# Doc QA — Pregunta en lenguaje natural sobre un documento local\n#\n# Lee un archivo del filesystem (contrato, README, spec, etc.) y responde una\n# pregunta anclando la respuesta SOLO en el contenido del archivo. Cita el texto\n# y, si la respuesta no esta en el documento, lo dice explicitamente.\n#\n# Permutacion: filesystem -> IA.\n#\n# Run:\n#   mirai run agents/doc-qa.yaml --input '{\"file_path\": \"./README.md\", \"question\": \"Como se instala el proyecto?\"}'\nname: doc-qa\nversion: v1\ndescription: \"Responde preguntas en lenguaje natural sobre un documento local, citando y anclado solo en su contenido\"\ninputs:\n  file_path:\n    type: text\n    required: true\n    description: \"Ruta del documento local a consultar (contrato, README, spec, .txt, .md...)\"\n  question:\n    type: text\n    required: false\n    default: \"De que trata este documento? Dame un resumen de sus puntos clave.\"\n    description: \"Pregunta en lenguaje natural sobre el contenido del documento\"\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n    - id: read\n      tool_type: filesystem/read_file\n    - id: answer\n      tool_type: ai/llm_call\n      config:\n        prompt: |\n          Eres un asistente de consulta documental. Tu unica fuente de verdad es\n          el DOCUMENTO que se te entrega como contexto. Responde la PREGUNTA del\n          usuario siguiendo estas reglas estrictas:\n\n          1. Respondes UNICAMENTE con informacion presente en el documento. No\n             inventes, no completes con conocimiento externo, no supongas.\n          2. Cita textualmente el fragmento en que te apoyas, entre comillas, para\n             que la respuesta sea verificable.\n          3. Si la respuesta NO esta en el documento, dilo con claridad:\n             \"El documento no contiene informacion sobre esto.\" No intentes\n             adivinar ni rellenar.\n          4. Se preciso y conciso. Espanol. Prioriza el dato exacto sobre el rodeo.\n          5. Si la pregunta es ambigua respecto al documento, senala que parte del\n             documento podria ser relevante y responde con lo que si esta.\n\n          Responde ahora la PREGUNTA con base exclusiva en el DOCUMENTO anterior.\n        temperature: 0.2\n        max_tokens: 4096\n    - id: respond\n      tool_type: output/response\n  edges:\n    - source: start\n      target: read\n      data_map:\n        path: \"start.payload.file_path\"\n    - source: read\n      target: answer\n      data_map:\n        context: \"read.content\"\n        prompt: \"start.payload.question\"\n    - source: answer\n      target: respond\n"},{"id":"market-pulse","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/market-pulse.yaml","relpath":"agents/market-pulse.yaml","source":"agents","mtimeMin":17166,"yaml":"# Market Pulse — Brief diario de mercado para trading (scrape -> IA -> archivo)\n#\n# Scrapea una página de mercado, la analiza como un trader (lectura risk-on/\n# risk-off, niveles clave por ticker, cifras citadas) y guarda un brief en\n# Markdown listo para leer antes de la apertura.\n#\n# Flujo: trigger -> data/web_scrape -> ai/llm_call -> filesystem/write_file -> output\n#\n# Run:\n#   mirai run agents/market-pulse.yaml \\\n#     --input '{\"tickers\": \"SPX, NDX, BTC, ETH, DXY, US10Y\", \"source_url\": \"https://www.investing.com/indices/major-indices\"}'\n#\n#   # con ruta de salida propia (p. ej. una por día):\n#   mirai run agents/market-pulse.yaml \\\n#     --input '{\"tickers\": \"AAPL, NVDA, TSLA\", \"source_url\": \"https://finance.yahoo.com/most-active\", \"output_path\": \"reports/2026-07-01-brief.md\"}'\n\nname: market-pulse\nversion: v1\ndescription: \"Brief diario de mercado para un trader: scrapea, analiza risk-on/risk-off con niveles y guarda un .md\"\n\ninputs:\n  tickers:\n    type: text\n    required: true\n    description: \"Tickers/activos a enfocar, separados por coma (ej: 'SPX, NDX, BTC, DXY, US10Y')\"\n  source_url:\n    type: text\n    required: true\n    description: \"URL de la página de mercado a scrapear (índices, cotizaciones, most-active, etc.)\"\n  output_path:\n    type: text\n    required: false\n    default: \"reports/market-pulse-brief.md\"\n    description: \"Ruta del brief Markdown a generar (por defecto reports/market-pulse-brief.md)\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # 1) Trae el HTML/texto de la página de mercado.\n    - id: scrape\n      tool_type: data/web_scrape\n      config:\n        max_content_length: 12000\n        timeout_seconds: 30\n\n    # 2) Analiza como trader: lectura macro + tabla por ticker + niveles, citando cifras.\n    - id: analyze\n      tool_type: ai/llm_call\n      config:\n        system_prompt: |\n          Eres un analista de trading senior (mesa de sell-side). Escribes briefs\n          pre-mercado accionables, en español, secos y directos. Trabajas SOLO con\n          las cifras que aparecen en los datos entregados: si un dato no está, lo\n          declaras \"n/d\" — JAMÁS inventas precios, niveles ni variaciones (un número\n          inventado le hace perder plata al trader). No das consejo de inversión.\n        prompt: |\n          Con los DATOS DE LA PÁGINA DE MERCADO entregados en el contexto, redacta el\n          BRIEF DIARIO en Markdown para los tickers en `tickers_foco`. Cita SIEMPRE la\n          cifra concreta (precio, variación %, punto) tomada del texto; si algo no está\n          en la página, escribe \"n/d\". Estructura exacta:\n\n          # Market Pulse — Brief diario\n          *Fecha: usa la que aparezca en la página; si no aparece, escribe \"n/d\". Fuente: <url o nombre de la página>.*\n\n          ## 1. Lectura del día: RISK-ON / RISK-OFF / MIXTO\n          Una frase con el veredicto en negrita y 2-3 bullets que lo justifiquen citando\n          números (ej: índices al alza, dólar/DXY, tasa 10Y, cripto). Sé explícito con el porqué.\n\n          ## 2. Tablero por activo\n          Tabla Markdown con columnas: | Activo | Último | Var. % día | Nivel clave (sop./res.) | Sesgo |\n          - \"Último\" y \"Var. %\": exactos de la página.\n          - \"Nivel clave\": soporte/resistencia razonable a partir de los datos disponibles\n            (rango del día, cierre previo, máximos/mínimos citados); si no hay base, \"n/d\".\n          - \"Sesgo\": Alcista / Bajista / Lateral, coherente con la variación.\n\n          ## 3. Qué vigilar hoy\n          3-5 bullets: niveles gatillo (\"si SPX pierde X…\"), correlaciones (DXY vs. riesgo,\n          tasas vs. tech) y cualquier catalizador/evento que aparezca en la página.\n\n          ## 4. Riesgos / lo que invalida la lectura\n          2-3 bullets con el escenario que rompería el sesgo anterior.\n\n          ---\n          *No es consejo de inversión. Cifras tomadas de la fuente citada; verifícalas antes de operar.*\n\n          Reglas: devuelve SOLO el Markdown del brief, sin preámbulo ni cierre fuera de la\n          estructura. Prioriza los activos de `tickers_foco`; si alguno no está en la página,\n          inclúyelo en la tabla con \"n/d\" y anótalo en \"Qué vigilar\".\n        temperature: 0.3\n        max_tokens: 3000\n\n    # 3) Guarda el brief en reports/.\n    - id: save\n      tool_type: filesystem/write_file\n\n    # 4) Confirma y termina.\n    - id: done\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: scrape\n      data_map:\n        url: \"start.payload.source_url\"\n\n    - source: scrape\n      target: analyze\n      data_map:\n        pagina_mercado: \"scrape.text\"\n        tickers_foco: \"start.payload.tickers\"\n        fuente_url: \"start.payload.source_url\"\n\n    - source: analyze\n      target: save\n      data_map:\n        content: \"analyze.response\"\n        path: \"start.payload.output_path\"\n\n    - source: save\n      target: done\n      data_map:\n        brief_guardado_en: \"save.path\"\n"},{"id":"meeting-digest","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/meeting-digest.yaml","relpath":"agents/meeting-digest.yaml","source":"agents","mtimeMin":17166,"yaml":"# Meeting Digest — Convierte un audio de reunión en notas estructuradas en español\n#\n# Permutación: transcribe → IA (resumen + decisiones + action items) → escribe markdown.\n# Recibe el audio de una reunión, lo transcribe, destila un acta accionable en español\n# y la guarda como archivo markdown en notes/.\n#\n# Run:\n#   mirai run agents/meeting-digest.yaml --provider gemini \\\n#     --api-key $GOOGLE_API_KEY \\\n#     --input '{\"audio_path\": \"/path/to/reunion.m4a\"}'\n#\n#   # con nombre de archivo de salida personalizado:\n#   mirai run agents/meeting-digest.yaml --provider gemini --api-key $GOOGLE_API_KEY \\\n#     --input '{\"audio_path\": \"/path/to/reunion.m4a\", \"notes_path\": \"notes/2026-07-01-kickoff.md\"}'\n\nname: meeting-digest\nversion: v1\ndescription: \"Transcribe un audio de reunión y genera notas accionables en español (markdown)\"\n\ninputs:\n  audio_path:\n    type: file\n    required: true\n    description: \"Audio de la reunión a procesar (.m4a, .mp3, .wav, .ogg, .flac)\"\n  notes_path:\n    type: text\n    required: false\n    default: \"notes/reunion-notas.md\"\n    description: \"Ruta del archivo markdown de salida (se crea notes/ si no existe)\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: transcribe\n      tool_type: ai/transcribe\n      config:\n        # Gemini 2.5 Flash: buena diarización de hablantes para reuniones.\n        model: \"gemini-2.5-flash\"\n\n    - id: digest\n      tool_type: ai/llm_call\n      config:\n        system_prompt: |\n          Eres un analista de reuniones senior. Trabajas SIEMPRE en español, con tono\n          directo y ejecutivo. Tu única fuente de verdad es la transcripción que recibes:\n          no inventes datos, nombres, fechas ni compromisos que no aparezcan en ella.\n        prompt: |\n          A partir de la transcripción de la reunión (que viene en el contexto), redacta\n          un acta accionable en ESPAÑOL. Devuelve ÚNICAMENTE markdown válido, sin texto\n          antes ni después, con exactamente esta estructura:\n\n          # Notas de reunión\n\n          ## Resumen ejecutivo\n          - 3 a 5 bullets con lo esencial: de qué se habló y a qué se llegó.\n\n          ## Decisiones tomadas\n          - Lista de decisiones acordadas (una por bullet). Si no hubo decisiones\n            explícitas, escribe: \"- Sin decisiones formales registradas.\"\n\n          ## Action items\n          Una tabla markdown con columnas: | Tarea | Responsable | Fecha límite |\n          - Extrae cada compromiso concreto como una fila.\n          - Responsable = la persona nombrada en la reunión; si no se asignó, escribe\n            \"(sin responsable asignado)\".\n          - Fecha límite = solo si se mencionó explícitamente; si no, escribe \"—\".\n\n          ## Temas y puntos clave\n          - Bullets con los temas discutidos y contexto relevante (riesgos, dudas abiertas).\n\n          ## Próximos pasos\n          - Bullets con lo que sigue inmediatamente después de esta reunión.\n\n          Reglas: no rellenes secciones con paja; si una sección no tiene contenido real\n          en la transcripción, déjala mínima y sé honesto (\"Sin información en el audio\").\n        temperature: 0.3\n        max_tokens: 4096\n\n    - id: save\n      tool_type: filesystem/write_file\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: transcribe\n      data_map:\n        file_path: \"start.payload.audio_path\"\n\n    - source: transcribe\n      target: digest\n      data_map:\n        context: \"transcribe.text\"\n\n    - source: digest\n      target: save\n      data_map:\n        path: \"start.payload.notes_path\"\n        content: \"digest.response\"\n\n    - source: save\n      target: respond\n"},{"id":"mirai-voice-note","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/mirai-voice-note.yaml","relpath":"agents/mirai-voice-note.yaml","source":"agents","mtimeMin":11522,"yaml":"# Mirai Voice Note — voz/nota de Gabriel -> mensaje listo para el orquestador Mirai central\n#\n# Pipeline (nodos REALES del Engine, espejo de voice-transcription.yaml):\n#   audio -> ai/transcribe (STT) -> ai/llm_call (enrich: diarizacion aprox + estructura)\n#         -> ai/llm_call (wrap: envuelve como mensaje accionable) -> output/response\n#\n# HONESTIDAD (ver diseno Fase 2, hallazgo §0):\n#   - ai/transcribe transcribe VERBATIM (prompt hardcodeado en el binario) y NO diariza.\n#     La \"diarizacion\" real vive en el nodo `enrich` (post-proceso LLM, confianza MEDIA).\n#     Para dictado corto de UN hablante (hablarle al orquestador), `enrich` es casi no-op.\n#   - ai/transcribe es de un solo tiro (sin segmentacion de 10 min): para notas LARGAS\n#     multi-hablante hay riesgo de truncamiento por el techo de Gemini (65k tok). Ese caso\n#     usa el camino B (shell-out a tools/transcribe_meeting.py) — NO este grafo. Ver V9.\n#\n# Run (la KEY la provee Gabriel al CLI del Engine, NO se lee de .env — archivos sagrados):\n#   # Ruta Gemini (LLM multimodal del CLI hace la transcripcion):\n#   mirai run agents/mirai-voice-note.yaml --provider gemini --api-key $GEMINI_API_KEY \\\n#     --input '{\"audio_path\":\"/ruta/dictado.m4a\",\"provider\":\"gemini\",\"speakers\":\"Gabriel\"}'\n#\n#   # Ruta ElevenLabs Scribe (misma key del TTS):\n#   mirai run agents/mirai-voice-note.yaml --provider claude --api-key dummy \\\n#     --input '{\"audio_path\":\"/ruta/dictado.m4a\",\"provider\":\"elevenlabs\",\"language\":\"es\"}'\n#\n# Ejecucion via HTTP API (lo que hace la app AgentMirai):\n#   POST /api/v1/agents/from-spec   (registra este spec -> {id})\n#   POST /api/v1/agents/{id}/execute  con {\"trigger_data\": {\"audio_path\": \"...\", \"provider\": \"gemini\", \"speakers\": \"Gabriel\"}}\n#   -> el texto final vive en response.state[\"respond\"][\"result\"]\n\nname: mirai-voice-note\nversion: v1\ndescription: \"Voz/nota de Gabriel: audio -> transcribe -> diariza (aprox) -> envuelve en prompt -> mensaje listo para el orquestador Mirai central\"\n\ninputs:\n  audio_path:\n    type: text\n    required: true\n    description: \"Ruta al audio (.m4a/.mp3/.wav/.webm) del dictado o nota de Gabriel\"\n  provider:\n    type: text\n    required: false\n    default: \"gemini\"\n    description: \"Proveedor STT: elevenlabs (Scribe) o cualquier otro valor para la ruta LLM multimodal (gemini)\"\n  model:\n    type: text\n    required: false\n    default: \"gemini-2.5-flash\"\n    description: \"Modelo STT (elevenlabs: scribe_v1 | ruta LLM: modelo del provider, default gemini-2.5-flash)\"\n  language:\n    type: text\n    required: false\n    description: \"Codigo ISO del idioma para elevenlabs, ej es (omitir = auto-detect)\"\n  speakers:\n    type: text\n    required: false\n    description: \"Nombres conocidos para el post-proceso de diarizacion (ej 'Gabriel, Tatiana')\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: stt\n      tool_type: ai/transcribe\n\n    # Diarizacion + estructura. NO vive en ai/transcribe (verbatim hardcodeado).\n    # Para 1 solo hablante es casi no-op. Confianza MEDIA (LLM atribuye hablantes).\n    - id: enrich\n      tool_type: ai/llm_call\n      config:\n        temperature: 0.2\n        max_tokens: 8192\n        system_prompt: |\n          Eres el diarizador de notas de voz de Gabriel. Trabajas SIEMPRE en espanol.\n          Tu unica fuente de verdad es la transcripcion que recibes en el contexto de sesion.\n        prompt: |\n          En el contexto de sesion recibes (via data_map, como datos de sesion):\n            - `transcripcion` -> el texto literal transcrito, SIN etiquetas de hablante.\n            - `speakers`      -> los participantes conocidos (puede venir vacio o ausente).\n\n          Devuelve la MISMA transcripcion, ahora DIARIZADA:\n            - Si hay participantes conocidos en `speakers`, atribuye cada bloque al hablante\n              mas probable con el prefijo \"Nombre: ...\" y marca los cambios de turno.\n            - Si `speakers` viene vacio/ausente o parece un solo hablante, devuelve el texto\n              tal cual (limpia saltos de linea sueltos) sin inventar nombres ni turnos.\n          Reglas estrictas: NO inventes, NO omitas, NO parafrasees palabras. Solo agregas la\n          etiqueta de hablante donde corresponda y limpias el formato.\n          Devuelve SOLO el texto (diarizado si aplica), sin comentarios tuyos.\n\n    # Envuelve la nota transcrita en UN mensaje accionable para el orquestador central.\n    - id: wrap\n      tool_type: ai/llm_call\n      config:\n        temperature: 0.3\n        max_tokens: 2048\n        system_prompt: |\n          Eres el pre-procesador de voz de Gabriel para el orquestador Mirai central.\n          Trabajas SIEMPRE en espanol, tono senior, directo, sin walls of text. Tu fuente\n          de verdad es EXCLUSIVAMENTE la nota que recibes: no inventes datos, nombres ni fechas.\n        prompt: |\n          En el contexto de sesion recibes `nota` -> la nota de voz de Gabriel ya transcrita\n          (y diarizada si aplica). Conviertela en UN mensaje claro y accionable para el\n          orquestador Mirai central: intencion + contexto minimo + el siguiente paso que pide.\n          Si la nota ya es una instruccion clara y corta, limpiala y devuelvela casi tal cual.\n          Devuelve SOLO el mensaje listo para enviar, sin preambulos, comillas ni etiquetas.\n\n    - id: respond\n      tool_type: output/response\n      config:\n        format: text\n\n  edges:\n    - source: start\n      target: stt\n      data_map:\n        file_path: \"start.payload.audio_path\"\n        provider: \"start.payload.provider\"\n        model: \"start.payload.model\"\n        language: \"start.payload.language\"\n\n    # El texto literal + los hablantes conocidos van al diarizador (post-proceso).\n    # Ambas aristas hacen fan-in: enrich ve `transcripcion` Y `speakers` como datos de sesion.\n    - source: stt\n      target: enrich\n      data_map:\n        transcripcion: \"stt.text\"\n    - source: start\n      target: enrich\n      data_map:\n        speakers: \"start.payload.speakers\"\n\n    - source: enrich\n      target: wrap\n      data_map:\n        nota: \"enrich.response\"\n\n    - source: wrap\n      target: respond\n      data_map:\n        data: \"wrap.response\"\n"},{"id":"research-synthesis","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/research-synthesis.yaml","relpath":"agents/research-synthesis.yaml","source":"agents","mtimeMin":17166,"yaml":"# Research Synthesis — Compara y sintetiza DOS fuentes web sobre un tema\n#\n# Permutacion: fan-in. Dos web_scrape corren en paralelo y convergen en un\n# unico llm_call que sintetiza, contrasta acuerdos/desacuerdos y cita cada fuente.\n# El informe final se guarda como markdown en disco.\n#\n# Flujo: trigger -> [web_scrape A, web_scrape B] -> ai/llm_call -> filesystem/write_file -> output\n#\n# Run:\n#   mirai run agents/research-synthesis.yaml \\\n#     --input '{\"url_a\": \"https://es.wikipedia.org/wiki/Energia_solar\", \"url_b\": \"https://es.wikipedia.org/wiki/Energia_eolica\", \"question\": \"Que ventajas y limitaciones tiene cada tecnologia?\"}'\n#\n#   # con ruta de salida propia:\n#   mirai run agents/research-synthesis.yaml \\\n#     --input '{\"url_a\": \"https://a.com\", \"url_b\": \"https://b.com\", \"question\": \"En que difieren?\", \"output_path\": \"reports/2026-07-01-sintesis.md\"}'\nname: research-synthesis\nversion: v1\ndescription: \"Sintetiza y compara dos fuentes web sobre un tema, marcando acuerdos y desacuerdos con citas\"\ninputs:\n  url_a:\n    type: text\n    required: true\n    description: \"URL de la primera fuente a comparar\"\n  url_b:\n    type: text\n    required: true\n    description: \"URL de la segunda fuente a comparar\"\n  question:\n    type: text\n    required: false\n    default: \"En que coinciden y en que difieren ambas fuentes sobre el tema?\"\n    description: \"Pregunta o eje de comparacion entre las dos fuentes\"\n  output_path:\n    type: text\n    required: false\n    default: \"reports/research-synthesis-report.md\"\n    description: \"Ruta del informe markdown a generar (se crea reports/ si no existe)\"\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # 1a) Trae el contenido de la primera fuente.\n    - id: scrape_a\n      tool_type: data/web_scrape\n      config:\n        max_content_length: 8000\n        timeout_seconds: 30\n\n    # 1b) Trae el contenido de la segunda fuente (corre en paralelo con scrape_a).\n    - id: scrape_b\n      tool_type: data/web_scrape\n      config:\n        max_content_length: 8000\n        timeout_seconds: 30\n\n    # 2) Fan-in: ambas fuentes convergen aqui. Sintetiza y CONTRASTA, no resume por separado.\n    - id: synthesize\n      tool_type: ai/llm_call\n      config:\n        system_prompt: |\n          Eres un analista de investigacion riguroso. Tu trabajo es COMPARAR y\n          SINTETIZAR fuentes, nunca resumirlas por separado. Reglas innegociables:\n          1. Respondes SIEMPRE en espanol y en formato Markdown.\n          2. Cada afirmacion clave se atribuye a (A), a (B) o a ambas.\n          3. No inventas datos que no esten en el contenido entregado.\n          4. Si una fuente vino vacia o es irrelevante, lo dices explicitamente.\n          5. Eres honesto con lo que no quedo confirmado; no rellenas con paja.\n        prompt: |\n          Recibes en el contexto de sesion tres piezas:\n            - context_a -> FUENTE A (contenido de la primera pagina web)\n            - context_b -> FUENTE B (contenido de la segunda pagina web)\n            - pregunta  -> el eje de comparacion que se te pidio\n\n          Sintetiza y CONTRASTA FUENTE A y FUENTE B respondiendo a `pregunta`.\n          Devuelve UNICAMENTE Markdown con esta estructura exacta:\n\n          # Sintesis comparativa\n\n          ## Pregunta\n          Reformula en una linea el eje de comparacion (`pregunta`).\n\n          ## Resumen ejecutivo\n          Un parrafo con la conclusion principal del contraste entre A y B.\n\n          ## Acuerdos\n          Bullets con los puntos en los que A y B COINCIDEN. En cada bullet cita\n          explicitamente ambas fuentes: \"(A) ... / (B) ...\".\n\n          ## Desacuerdos y matices\n          Bullets con contradicciones, enfasis distintos o datos que difieren entre\n          A y B. Indica que dice cada una y, si es posible, cual parece mas solida y\n          por que.\n\n          ## Vacios y baja confianza\n          Que afirmaciones NO pudiste verificar por falta de datos, o que aparecen en\n          una sola fuente y no en la otra. Se honesto con lo que no quedo confirmado.\n\n          ## Conclusion\n          Cierre accionable que responda directamente a la pregunta.\n        temperature: 0.4\n        max_tokens: 4096\n        max_context_length: 20000\n\n    # 3) Guarda el informe en la ruta indicada (reports/ por defecto).\n    - id: save_report\n      tool_type: filesystem/write_file\n\n    # 4) Confirma y termina.\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    # Fan-out: el trigger dispara los dos scrapes en paralelo.\n    - source: start\n      target: scrape_a\n      data_map:\n        url: \"start.payload.url_a\"\n\n    - source: start\n      target: scrape_b\n      data_map:\n        url: \"start.payload.url_b\"\n\n    # Fan-in: ambos scrapes convergen en synthesize. resolve_inputs une el data_map\n    # de TODAS las aristas entrantes, asi que synthesize recibe context_a, context_b y pregunta.\n    - source: scrape_a\n      target: synthesize\n      data_map:\n        context_a: \"scrape_a.text\"\n        pregunta: \"start.payload.question\"\n\n    - source: scrape_b\n      target: synthesize\n      data_map:\n        context_b: \"scrape_b.text\"\n\n    # El informe generado por el LLM se escribe a disco (path via data_map, no config).\n    - source: synthesize\n      target: save_report\n      data_map:\n        content: \"synthesize.response\"\n        path: \"start.payload.output_path\"\n\n    - source: save_report\n      target: respond\n      data_map:\n        informe_guardado_en: \"save_report.path\"\n"},{"id":"support-router","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/support-router.yaml","relpath":"agents/support-router.yaml","source":"agents","mtimeMin":15504,"yaml":"# Support Router — Triage automatico de tickets de soporte\n#\n# Clasifica el mensaje entrante en billing | technical | general y lo enruta:\n# si es \"billing\" lo atiende un especialista de facturacion; cualquier otra\n# categoria (technical/general) cae en el handler general. Demuestra routing\n# condicional exclusivo con logic/condition (una sola rama se ejecuta).\n#\n# Run:\n#   mirai run agents/support-router.yaml --input '{\"message\": \"Me cobraron dos veces la suscripcion de este mes\"}'\n#   mirai run agents/support-router.yaml --input '{\"message\": \"La app se cierra sola cuando abro el dashboard\"}'\n\nname: support-router\nversion: v1\ndescription: \"Triage automatico de tickets de soporte con routing condicional por categoria\"\n\ninputs:\n  message:\n    type: text\n    required: true\n    description: \"El mensaje/ticket del cliente a clasificar y atender\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/webhook\n\n    - id: classify\n      tool_type: ai/llm_call\n      config:\n        prompt: |\n          Eres el sistema de triage de un equipo de soporte. Clasifica el mensaje\n          del cliente en EXACTAMENTE una de estas categorias:\n            - billing    -> cobros, facturas, reembolsos, pagos, planes, precios\n            - technical  -> errores, bugs, caidas, fallos de login, problemas de la app\n            - general    -> dudas de uso, informacion, cualquier otra cosa\n          Responde con UNA sola palabra en minusculas: billing, technical o general.\n          No agregues explicaciones, puntuacion ni texto adicional.\n        temperature: 0.0\n        max_tokens: 10\n\n    # `field` (el valor a evaluar) llega por data_map desde classify;\n    # operator + value son config estatica del nodo.\n    - id: check\n      tool_type: logic/condition\n      config:\n        operator: equals\n        value: billing\n\n    - id: billing_handler\n      tool_type: ai/llm_call\n      config:\n        prompt: |\n          Eres un especialista de facturacion. El cliente tiene un problema de\n          cobros o pagos. Responde con empatia y de forma resolutiva:\n          1) reconoce el problema, 2) explica los pasos concretos para resolverlo\n          (verificar el cargo, plazos de reembolso, ajuste de plan segun aplique),\n          3) indica que datos necesitas del cliente para avanzar.\n          Se claro y breve. Responde en espanol.\n        temperature: 0.5\n        max_tokens: 512\n\n    - id: general_handler\n      tool_type: ai/llm_call\n      config:\n        prompt: |\n          Eres un agente de soporte general (atiende dudas tecnicas y consultas\n          generales). Responde de forma util y accionable:\n          1) si es un problema tecnico, da pasos de diagnostico y solucion\n          (reinicio, version de la app, limpiar cache, reportar el error);\n          2) si es una duda general, respondela con claridad.\n          Se cercano y concreto. Responde en espanol.\n        temperature: 0.6\n        max_tokens: 512\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: classify\n      data_map:\n        context: \"start.payload.message\"\n\n    - source: classify\n      target: check\n      data_map:\n        field: \"classify.response\"\n\n    - source: check\n      target: billing_handler\n      condition:\n        field: result\n        op: equals\n        value: true\n\n    - source: check\n      target: general_handler\n      condition:\n        field: result\n        op: equals\n        value: false\n\n    - source: billing_handler\n      target: respond\n\n    - source: general_handler\n      target: respond\n"},{"id":"voice-synthesis","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/voice-synthesis.yaml","relpath":"agents/voice-synthesis.yaml","source":"agents","mtimeMin":17166,"yaml":"# Voice Synthesis — texto -> voz (MP3) via ElevenLabs o Cartesia\n#\n# UN solo agente. El cliente elige el proveedor con el input \"provider\" (elevenlabs | cartesia);\n# el nodo ai/tts enruta internamente a la API correspondiente, sintetiza el MP3 y devuelve su ruta.\n# (El branch vive en la tool ai/tts, no en un logic/condition: mas robusto y un solo archivo.)\n#\n# Run:\n#   mirai run agents/voice-synthesis.yaml --input '{\"text\":\"Hola, soy tu asistente.\",\"provider\":\"elevenlabs\",\"voice_id\":\"21m00Tcm4TlvDq8ikWAM\"}'\n#   mirai run agents/voice-synthesis.yaml --input '{\"text\":\"Hola, soy tu asistente.\",\"provider\":\"cartesia\",\"voice_id\":\"a0e99841-438c-4a64-b679-ae501e7d6091\"}'\n#\n# Requiere: ELEVENLABS_API_KEY o CARTESIA_API_KEY en el entorno (o pasar \"api_key\" en el input).\n\nname: voice-synthesis\nversion: v1\ndescription: \"Sintetiza voz (MP3) desde texto via ElevenLabs o Cartesia, segun el proveedor elegido por el cliente\"\n\ninputs:\n  text:\n    type: text\n    required: true\n    description: \"Texto a convertir en voz\"\n  provider:\n    type: text\n    required: false\n    default: \"elevenlabs\"\n    description: \"Proveedor TTS: elevenlabs o cartesia\"\n  voice_id:\n    type: text\n    required: false\n    description: \"ID de la voz (ElevenLabs = de su libreria; Cartesia = UUID)\"\n  model:\n    type: text\n    required: false\n    description: \"Modelo TTS (default: eleven_flash_v2_5 / sonic-3.5)\"\n  stability:\n    type: number\n    required: false\n    description: \"ElevenLabs: estabilidad 0-1\"\n  similarity_boost:\n    type: number\n    required: false\n    description: \"ElevenLabs: similitud 0-1\"\n  style:\n    type: number\n    required: false\n    description: \"ElevenLabs: exageracion de estilo 0-1\"\n  language:\n    type: text\n    required: false\n    description: \"Cartesia: codigo ISO del idioma (ej es, en)\"\n  speed:\n    type: number\n    required: false\n    description: \"Cartesia: velocidad de habla 0.6-1.5\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: synth\n      tool_type: ai/tts\n      config:\n        provider: elevenlabs   # default; el input \"provider\" lo sobreescribe por llamada\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: synth\n      data_map:\n        text: \"start.payload.text\"\n        provider: \"start.payload.provider\"\n        voice_id: \"start.payload.voice_id\"\n        model: \"start.payload.model\"\n        stability: \"start.payload.stability\"\n        similarity_boost: \"start.payload.similarity_boost\"\n        style: \"start.payload.style\"\n        language: \"start.payload.language\"\n        speed: \"start.payload.speed\"\n\n    - source: synth\n      target: respond\n      data_map:\n        audio_path: \"synth.audio_path\"\n        provider: \"synth.provider\"\n        format: \"synth.format\"\n"},{"id":"voice-transcription","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/voice-transcription.yaml","relpath":"agents/voice-transcription.yaml","source":"agents","mtimeMin":17166,"yaml":"# Voice Transcription — audio -> texto via Gemini (LLM multimodal) o ElevenLabs Scribe\n#\n# UN solo agente, espejo de voice-synthesis. El cliente elige el proveedor con el input\n# \"provider\": \"elevenlabs\" usa la API Scribe; cualquier otro valor (\"gemini\", \"llm\", vacio)\n# usa el LLM provider configurado en el CLI como transcriptor multimodal (la ruta de Aftrmeet).\n# (El branch vive DENTRO de la tool ai/transcribe, no en un logic/condition: mas robusto.)\n#\n# Run:\n#   # Ruta ElevenLabs Scribe (misma key del TTS; no necesita LLM real):\n#   mirai run agents/voice-transcription.yaml --provider claude --api-key dummy \\\n#     --input '{\"audio_path\":\"/ruta/grabacion.m4a\",\"provider\":\"elevenlabs\",\"language\":\"es\"}'\n#\n#   # Ruta Gemini (LLM multimodal — el provider del CLI hace la transcripcion):\n#   mirai run agents/voice-transcription.yaml --provider gemini --api-key $GEMINI_API_KEY \\\n#     --input '{\"audio_path\":\"/ruta/grabacion.m4a\",\"provider\":\"gemini\"}'\n#\n# Requiere: ELEVENLABS_API_KEY en el entorno para la ruta elevenlabs (o \"api_key\" en config).\n\nname: voice-transcription\nversion: v1\ndescription: \"Transcribe audio a texto via ElevenLabs Scribe o el LLM multimodal del CLI (Gemini), segun el proveedor elegido por el cliente\"\n\ninputs:\n  audio_path:\n    type: text\n    required: true\n    description: \"Ruta al archivo de audio a transcribir (m4a, mp3, wav, webm...)\"\n  provider:\n    type: text\n    required: false\n    default: \"gemini\"\n    description: \"Proveedor STT: elevenlabs (Scribe) o cualquier otro valor para la ruta LLM multimodal\"\n  model:\n    type: text\n    required: false\n    default: \"gemini-2.5-flash\"\n    description: \"Modelo (elevenlabs: scribe_v1 default | ruta LLM: modelo del provider; default gemini-2.5-flash — la app no manda modelo y Gemini rechaza 'default')\"\n  language:\n    type: text\n    required: false\n    description: \"Codigo ISO del idioma, ej es (solo elevenlabs; omitir = auto-detect)\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: stt\n      tool_type: ai/transcribe\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: stt\n      data_map:\n        file_path: \"start.payload.audio_path\"\n        provider: \"start.payload.provider\"\n        model: \"start.payload.model\"\n        language: \"start.payload.language\"\n\n    - source: stt\n      target: respond\n      data_map:\n        text: \"stt.text\"\n        duration_seconds: \"stt.duration_seconds\"\n        provider: \"stt.provider\"\n"},{"id":"audio-transcription","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/examples/audio-transcription.yaml","relpath":"examples/audio-transcription.yaml","source":"examples","mtimeMin":86188,"yaml":"# Audio Transcription — Multimodal file input (v0.5.0)\n#\n# Receives an audio file, transcribes it via multimodal LLM, and\n# normalizes the text. Demonstrates:\n#   - File inputs (type: file)\n#   - ai/transcribe with real audio (not text path)\n#   - Multi-step pipeline (transcribe → normalize)\n#\n# Run:\n#   mirai run examples/audio-transcription.yaml --provider gemini \\\n#     --api-key $GOOGLE_API_KEY \\\n#     --input '{\"audio_path\": \"/path/to/recording.m4a\"}'\n\nname: audio-transcription\nversion: v1\ndescription: \"Transcribe audio to clean text via multimodal LLM\"\n\ninputs:\n  audio_path:\n    type: file\n    required: true\n    description: \"Audio file to transcribe (.m4a, .mp3, .wav, .ogg, .flac)\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: transcribe\n      tool_type: ai/transcribe\n      config:\n        model: \"gemini-2.5-flash\"\n\n    - id: normalize\n      tool_type: ai/llm_call\n      config:\n        prompt: |\n          Clean up this raw transcription:\n          - Remove filler words (um, uh, like, you know, etc.)\n          - Fix grammar and punctuation\n          - Keep the original language and meaning\n          - Output ONLY the cleaned text\n        temperature: 0.3\n        max_tokens: 4096\n        model: \"gemini-2.5-flash\"\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: transcribe\n      data_map:\n        file_path: \"start.payload.audio_path\"\n\n    - source: transcribe\n      target: normalize\n      data_map:\n        context: \"transcribe.text\"\n\n    - source: normalize\n      target: respond\n"},{"id":"conditional-routing","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/examples/conditional-routing.yaml","relpath":"examples/conditional-routing.yaml","source":"examples","mtimeMin":15505,"yaml":"# Conditional Routing — Branching based on LLM classification\n#\n# The LLM classifies the user's input into a category, then the agent\n# routes to different handlers based on the classification result.\n# Demonstrates edge conditions and exclusive routing.\n#\n# Run:\n#   mirai run examples/conditional-routing.yaml --input '{\"query\": \"My order has not arrived\"}'\n#   mirai run examples/conditional-routing.yaml --input '{\"query\": \"How do I reset my password?\"}'\n\nname: conditional-router\nversion: v1\ndescription: \"Classify input and route to the right handler\"\n\ninputs:\n  query:\n    type: text\n    required: true\n    description: \"The user's message to classify and handle\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: classify\n      tool_type: ai/llm_call\n      config:\n        prompt: |\n          Classify the following user message into exactly one category.\n          Reply with ONLY the category name, nothing else.\n          Categories: support, billing, technical\n        temperature: 0.0\n        max_tokens: 20\n\n    # The value to evaluate arrives as the `field` input (wired via data_map\n    # on the incoming edge); `operator` + `value` are static node config.\n    - id: check\n      tool_type: logic/condition\n      config:\n        operator: equals\n        value: support\n\n    - id: support_handler\n      tool_type: ai/llm_call\n      config:\n        prompt: \"You are a friendly support agent. Help the user with their issue.\"\n        temperature: 0.7\n        max_tokens: 512\n\n    - id: default_handler\n      tool_type: ai/llm_call\n      config:\n        prompt: \"You are a helpful assistant. Answer the user's question.\"\n        temperature: 0.7\n        max_tokens: 512\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: classify\n      data_map:\n        context: \"start.payload.query\"\n\n    - source: classify\n      target: check\n      data_map:\n        field: \"classify.response\"\n\n    - source: check\n      target: support_handler\n      condition:\n        field: result\n        op: equals\n        value: true\n\n    - source: check\n      target: default_handler\n      condition:\n        field: result\n        op: equals\n        value: false\n\n    - source: support_handler\n      target: respond\n\n    - source: default_handler\n      target: respond\n"},{"id":"data-pipeline","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/examples/data-pipeline.yaml","relpath":"examples/data-pipeline.yaml","source":"examples","mtimeMin":86188,"yaml":"# Data Pipeline — Multi-step workflow with data flow\n#\n# A realistic agent that: reads a file, passes its content to an LLM\n# for analysis, and returns the result. Demonstrates data_map\n# (passing data between nodes) and multiple tool types.\n#\n# Run:\n#   mirai run examples/data-pipeline.yaml --input '{\"file_path\": \"README.md\"}'\n\nname: data-pipeline\nversion: v1\ndescription: \"Read a file, analyze with LLM, save the result\"\n\ninputs:\n  file_path:\n    type: text\n    required: true\n    description: \"Path to the file to analyze\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: read\n      tool_type: filesystem/read_file\n\n    - id: analyze\n      tool_type: ai/llm_call\n      config:\n        prompt: |\n          Analyze the following text and provide:\n          1. A one-line summary\n          2. Key topics covered\n          3. Suggested improvements\n        temperature: 0.5\n        max_tokens: 1024\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: read\n      data_map:\n        path: \"start.payload.file_path\"\n\n    - source: read\n      target: analyze\n      data_map:\n        context: \"read.content\"\n\n    - source: analyze\n      target: respond\n"},{"id":"hello-world","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/examples/hello-world.yaml","relpath":"examples/hello-world.yaml","source":"examples","mtimeMin":86188,"yaml":"# Hello World — The simplest possible agent\n#\n# A single LLM call that answers a question. Three nodes, two edges.\n# This is the \"Hello World\" of agentic workflows.\n#\n# Run:\n#   mirai run examples/hello-world.yaml --input '{\"question\": \"What is Rust?\"}'\n#   mirai run examples/hello-world.yaml --provider claude --api-key $ANTHROPIC_API_KEY\n\nname: hello-world\nversion: v1\ndescription: \"Answer a question using an LLM\"\n\ninputs:\n  question:\n    type: text\n    required: true\n    description: \"The question to answer\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: think\n      tool_type: ai/llm_call\n      config:\n        prompt: \"Answer the following question concisely and accurately.\"\n        temperature: 0.7\n        max_tokens: 512\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: think\n      data_map:\n        context: \"start.payload.question\"\n\n    - source: think\n      target: respond\n"},{"id":"image-analysis","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/examples/image-analysis.yaml","relpath":"examples/image-analysis.yaml","source":"examples","mtimeMin":86188,"yaml":"# Image Analysis — Multimodal vision (v0.5.0)\n#\n# Receives an image file and describes its contents using a\n# multimodal LLM. Demonstrates:\n#   - File inputs (type: file)\n#   - ai/llm_call with media_path for vision\n#   - Works with any image: screenshots, photos, documents\n#\n# Run:\n#   mirai run examples/image-analysis.yaml --provider gemini \\\n#     --api-key $GOOGLE_API_KEY \\\n#     --input '{\"image_path\": \"/path/to/screenshot.png\"}'\n#\n#   # Also works with Claude for images:\n#   mirai run examples/image-analysis.yaml --provider claude \\\n#     --api-key $ANTHROPIC_API_KEY \\\n#     --input '{\"image_path\": \"/path/to/photo.jpg\"}'\n\nname: image-analysis\nversion: v1\ndescription: \"Describe image contents using multimodal LLM\"\n\ninputs:\n  image_path:\n    type: file\n    required: true\n    description: \"Image file to analyze (.png, .jpg, .webp)\"\n  question:\n    type: text\n    required: false\n    default: \"Describe what you see in this image in detail.\"\n    description: \"What to ask about the image\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: analyze\n      tool_type: ai/llm_call\n      config:\n        temperature: 0.5\n        max_tokens: 1024\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: analyze\n      data_map:\n        media_path: \"start.payload.image_path\"\n        prompt: \"start.payload.question\"\n\n    - source: analyze\n      target: respond\n"},{"id":"image-editing","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/examples/image-editing.yaml","relpath":"examples/image-editing.yaml","source":"examples","mtimeMin":15503,"yaml":"# Image Editing — AI inpainting on a local image (OpenAI GPT-Image-1)\n#\n# Edits a specific area of an image. The ai/image_edit tool calls the\n# OpenAI Images API directly, so a real key is required even with\n# `--provider mock` (the mock only replaces the LLM, not this API).\n#\n# Run:\n#   OPENAI_API_KEY=sk-... mirai run examples/image-editing.yaml \\\n#     --input '{\"image_path\": \"/path/to/photo.png\", \"prompt\": \"replace the sky with a sunset\"}'\n\nname: image-editing\nversion: v1\ndescription: \"Edit a specific area of an image using AI inpainting (OpenAI GPT-Image-1)\"\n\ninputs:\n  image_path:\n    type: file\n    required: true\n    description: \"Base image to edit (PNG)\"\n  mask_path:\n    type: file\n    required: false\n    description: \"Mask image (PNG with alpha channel: transparent = area to edit)\"\n  prompt:\n    type: text\n    required: true\n    description: \"Description of the desired edit\"\n\noutput
