name: "Text Classifier Chain"
version: v1
agent_type: managed

graph:
  nodes:
    - id: trigger
      tool_type: trigger/webhook
      config:
        payload:
          texto: "El botón de login no responde cuando hago click"

    - id: classify
      tool_type: ai/llm_call
      config:
        model: gemma4
        prompt: >
          Clasifica el siguiente texto en una de estas categorías:
          [bug, feature, pregunta, otro]. Responde SOLO con la categoría.
        temperature: 0.0
        max_tokens: 512

  edges:
    - id: e1
      source: trigger
      target: classify
      data_map:
        user_text: "trigger.body"
