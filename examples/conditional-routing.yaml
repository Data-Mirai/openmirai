# Conditional Routing — Branching based on LLM classification
#
# The LLM classifies the user's input into a category, then the agent
# routes to different handlers based on the classification result.
# Demonstrates edge conditions and exclusive routing.
#
# Run:
#   mirai run examples/conditional-routing.yaml --input '{"query": "My order hasn't arrived"}'
#   mirai run examples/conditional-routing.yaml --input '{"query": "How do I reset my password?"}'

name: conditional-router
version: v1
description: "Classify input and route to the right handler"

inputs:
  query:
    type: text
    required: true
    description: "The user's message to classify and handle"

graph:
  nodes:
    - id: start
      tool_type: trigger/manual

    - id: classify
      tool_type: ai/llm_call
      config:
        prompt: |
          Classify the following user message into exactly one category.
          Reply with ONLY the category name, nothing else.
          Categories: support, billing, technical
        temperature: 0.0
        max_tokens: 20

    - id: check
      tool_type: logic/condition
      config:
        field: response
        op: equals
        value: support

    - id: support_handler
      tool_type: ai/llm_call
      config:
        prompt: "You are a friendly support agent. Help the user with their issue."
        temperature: 0.7
        max_tokens: 512

    - id: default_handler
      tool_type: ai/llm_call
      config:
        prompt: "You are a helpful assistant. Answer the user's question."
        temperature: 0.7
        max_tokens: 512

    - id: respond
      tool_type: output/response

  edges:
    - source: start
      target: classify
      data_map:
        context: "start.payload.query"

    - source: classify
      target: check

    - source: check
      target: support_handler
      condition:
        field: result
        op: equals
        value: true

    - source: check
      target: default_handler
      condition:
        field: result
        op: equals
        value: false

    - source: support_handler
      target: respond

    - source: default_handler
      target: respond
