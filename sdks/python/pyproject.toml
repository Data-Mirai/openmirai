[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmirai"
version = "0.6.0"
description = "Python SDK for OpenMirai — agentic graph execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
all = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Gabo-TheCreator/openmirai"
Repository = "https://github.com/Gabo-TheCreator/openmirai"
Issues = "https://github.com/Gabo-TheCreator/openmirai/issues"
Changelog = "https://github.com/Gabo-TheCreator/openmirai/blob/main/CHANGELOG.md"
