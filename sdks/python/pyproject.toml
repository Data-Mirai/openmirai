[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datamirai"
version = "0.1.0"
description = "Python SDK for Mirai Engine — agentic graph execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
all = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/datamirai/engine"
Repository = "https://github.com/datamirai/engine"
