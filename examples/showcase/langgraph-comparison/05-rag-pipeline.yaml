name: "RAG Pipeline"
version: v1
agent_type: managed

graph:
  nodes:
    - id: trigger
      tool_type: trigger/webhook
      config:
        payload:
          question: "¿En qué lenguaje está escrito Mirai Engine?"

    - id: search
      tool_type: data/vector_search
      config:
        top_k: 2

    - id: generate
      tool_type: ai/llm_call
      config:
        model: gemma4
        prompt: >
          Responde SOLO basándote en el contexto proporcionado.
          Si no tienes la información, di 'No tengo esa información'.
        temperature: 0.3
        max_tokens: 1024

  edges:
    - id: e1
      source: trigger
      target: search
      data_map:
        query: "trigger.body.question"

    - id: e2
      source: search
      target: generate
      data_map:
        context: "search.results"
        question: "trigger.body.question"
