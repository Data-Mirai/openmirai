name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  publication-safety:
    name: public repository boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check public repository boundary
        env:
          PUBLICATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/check_publication_safety.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-rust:
    name: Rust Unit & Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and builds
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --workspace --all-features

      - name: Run Cargo Tests
        run: cargo test --workspace --all-features

      - name: Build Binary for Integration Tests
        run: cargo build

      - name: Run CLI Integration Script
        run: bash test/run_all.sh

      - name: Run HTTP Server E2E Tests
        run: bash test/e2e_server.sh

  test-python-sdk:
    name: Python SDK E2E Verification
    runs-on: ubuntu-latest
    needs: test-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and builds
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python SDK dependencies
        run: |
          pip install -e sdks/python

      - name: Build Rust Binary for SDK
        run: cargo build

      - name: Run Python SDK E2E Tests
        run: |
          cd sdks/python
          python3 test_sdk.py

  test-typescript-sdk:
    name: TypeScript SDK E2E Verification
    runs-on: ubuntu-latest
    needs: test-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and builds
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node.js dependencies
        run: |
          cd sdks/typescript
          # Generate package-lock if not present, then install
          npm install

      - name: Build Rust Binary for SDK
        run: cargo build

      - name: Run TypeScript SDK E2E Tests
        run: |
          cd sdks/typescript
          # Run tests with vitest
          npm run test -- --run
