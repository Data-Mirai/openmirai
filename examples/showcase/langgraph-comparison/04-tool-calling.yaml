name: "Tool Calling Demo"
version: v1
agent_type: managed

graph:
  nodes:
    - id: trigger
      tool_type: trigger/webhook
      config:
        payload:
          city: "Bogotá"

    - id: weather
      tool_type: custom/get_weather
      config: {}

  edges:
    - id: e1
      source: trigger
      target: weather
      data_map:
        city: "trigger.body.city"
