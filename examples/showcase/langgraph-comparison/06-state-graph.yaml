name: "Order Processing Pipeline"
version: v1
agent_type: managed

graph:
  nodes:
    - id: trigger
      tool_type: trigger/webhook
      config:
        payload:
          order_id: "ORD-001"
          items: ["pizza", "soda", "burger"]

    - id: validate
      tool_type: order/validate

    - id: calculate
      tool_type: order/calculate

    - id: confirm
      tool_type: order/confirm

  edges:
    - id: e1
      source: trigger
      target: validate
      data_map:
        order_id: "trigger.body.order_id"
        items: "trigger.body"

    - id: e2
      source: validate
      target: calculate
      data_map:
        items: "trigger.body"

    - id: e3
      source: calculate
      target: confirm
      data_map:
        order_id: "trigger.body.order_id"
        total: "calculate.total"
