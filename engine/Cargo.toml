[package]
name = "datamirai-engine"
version = "0.3.1"
edition = "2021"
description = "Open-source agentic graph execution engine"
license = "MIT"

[lib]
name = "datamirai_engine"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
regex = "1"
glob = "0.3"
fnv = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.35", features = ["bundled"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tokio-stream = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
