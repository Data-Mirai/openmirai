name: "Text Classifier (Portable)"
version: v1
agent_type: managed

graph:
  nodes:
    - id: trigger
      tool_type: trigger/webhook
      config:
        path: /classify
        method: POST

    - id: classify
      tool_type: ai/llm_call
      config:
        model: gemma4
        prompt: >
          Clasifica el siguiente texto en una de estas categorías:
          [bug, feature, pregunta, otro]. Responde SOLO con la categoría.
        temperature: 0.0
        max_tokens: 512

  edges:
    - id: e1
      source: trigger
      target: classify
      data_map:
        user_text: "trigger.body"

triggers:
  - type: webhook
    path: /api/classify
    method: POST
    auth: bearer
