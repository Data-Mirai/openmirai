s:\n  result:\n    type: file\n    description: \"Edited image (PNG)\"\n  revised_prompt:\n    type: text\n    description: \"Prompt as revised by OpenAI\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: edit\n      tool_type: ai/image_edit\n      config:\n        model: gpt-image-1\n        size: auto\n        quality: high\n\n    - id: out\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: edit\n      data_map:\n        image_path: \"start.payload.image_path\"\n        mask_path: \"start.payload.mask_path\"\n        prompt: \"start.payload.prompt\"\n\n    - source: edit\n      target: out\n      data_map:\n        result: \"edit.result_path\"\n        revised_prompt: \"edit.revised_prompt\"\n"},{"id":"dictation-stt","path":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/dictation-stt.yaml","relpath":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/dictation-stt.yaml","source":"aftrmeet","mtimeMin":68993,"yaml":"# Dictation STT Agent\n#\n# Audio (single speaker, short) → FAITHFUL verbatim transcription.\n# Dedicated to dictation + prompt-flow audio (PRD-001: never normalize/rewrite/omit).\n#\n# NOTE: ai/transcribe is engine-hardcoded to faithful verbatim (the instruction lives\n# in the mirai binary; YAML config takes only `model`). This agent exists as a dedicated\n# name so dictation transcription can evolve independently of meeting transcription.\n#\n# Result in state.transcribe.text (read by host via response(from:\"transcribe\")).\n# Requires: datamirai-engine >= v0.5.0\n\nname: dictation-stt\nversion: v1\ndescription: \"Faithful verbatim transcription of single-speaker dictation\"\n\ninputs:\n  audio_path:\n    type: file\n    required: true\n    description: \"Audio file to transcribe (.m4a, .mp3, .wav, .ogg, .flac)\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: transcribe\n      tool_type: ai/transcribe\n      config:\n        model: \"gemini-2.5-flash\"\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: transcribe\n      data_map:\n        file_path: \"start.payload.audio_path\"\n\n    - source: transcribe\n      target: respond\n"},{"id":"meeting-insights","path":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/meeting-insights.yaml","relpath":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/meeting-insights.yaml","source":"aftrmeet","mtimeMin":14772,"yaml":"# Meeting Insights Agent\n#\n# Transcript text → structured meeting insights (JSON).\n# Generates: title, summary, bullet points, participants, action items.\n#\n# Requires: openmirai-engine >= v0.7.0 (output_schema como string JSON)\n\nname: meeting-insights\nversion: v1\ndescription: \"Generate structured meeting insights from transcript\"\n\ninputs:\n  transcript:\n    type: text\n    required: true\n    description: \"Meeting transcript text\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: analyze\n      tool_type: ai/llm_call\n      config:\n        model: \"gemini-2.5-flash\"\n        prompt: |\n          You are an intelligent meeting assistant. Analyze the following meeting transcript.\n          Provide a structured summary including:\n          1. A relevant title.\n          2. A concise summary.\n          3. Key bullet points.\n          4. Participants identified (infer names if possible).\n          5. Action items with assignees.\n\n          IMPORTANT: Content must be in the SAME language as the transcript. JSON keys in English.\n          Return ONE single JSON object (NOT an array, no wrapping brackets, no markdown fences).\n          The top-level value must be a single object with exactly these keys: title, summary,\n          bulletPoints, participants, actionItems.\n        temperature: 0.1\n        max_tokens: 65536\n        # OpenMirai 0.7.0: la validación estricta de config del tool ai/llm_call declara\n        # output_schema como STRING (JSON Schema serializado). Un objeto YAML inline es\n        # rechazado en runtime (\"expected type string, got object\") → va como bloque JSON.\n        output_schema: |\n          {\n            \"type\": \"object\",\n            \"properties\": {\n              \"title\": { \"type\": \"string\" },\n              \"summary\": { \"type\": \"string\" },\n              \"bulletPoints\": { \"type\": \"array\", \"items\": { \"type\": \"string\" } },\n              \"participants\": {\n                \"type\": \"array\",\n                \"items\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                    \"name\": { \"type\": \"string\" },\n                    \"note\": { \"type\": \"string\" }\n                  }\n                }\n              },\n              \"actionItems\": {\n                \"type\": \"array\",\n                \"items\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                    \"description\": { \"type\": \"string\" },\n                    \"assignee\": { \"type\": \"string\" }\n                  }\n                }\n              }\n            },\n            \"required\": [\"title\", \"summary\", \"bulletPoints\", \"participants\", \"actionItems\"]\n          }\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: analyze\n      data_map:\n        context: \"start.user_input\"\n\n    - source: analyze\n      target: respond\n"},{"id":"meeting-stt","path":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/meeting-stt.yaml","relpath":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/meeting-stt.yaml","source":"aftrmeet","mtimeMin":68993,"yaml":"# Meeting STT Agent\n#\n# Audio (long, multi-speaker) → transcription.\n# Dedicated to meeting recording/import/reprocess, separate from dictation so meeting\n# transcription can be tuned independently without ever touching dictation fidelity.\n#\n# NOTE: ai/transcribe is engine-hardcoded to FAITHFUL VERBATIM (the instruction lives in\n# the mirai binary; YAML config takes only `model`). \"Light structure\" (punctuation /\n# paragraphs) is NOT achievable via ai/transcribe alone — it would require an ai/llm_call\n# post-node that risks paraphrasing/omitting words (forbidden). Deferred pending PM decision.\n# Today this agent = faithful verbatim, identical behavior to dictation-stt but separately tunable.\n#\n# Result in state.transcribe.text (read by host via response(from:\"transcribe\")).\n# Requires: datamirai-engine >= v0.5.0\n\nname: meeting-stt\nversion: v1\ndescription: \"Transcription of long, multi-speaker meeting audio\"\n\ninputs:\n  audio_path:\n    type: file\n    required: true\n    description: \"Meeting audio file to transcribe (.m4a, .mp3, .wav, .ogg, .flac)\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: transcribe\n      tool_type: ai/transcribe\n      config:\n        model: \"gemini-2.5-flash\"\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: transcribe\n      data_map:\n        file_path: \"start.payload.audio_path\"\n\n    - source: transcribe\n      target: respond\n"},{"id":"prompt-preparer","path":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/prompt-preparer.yaml","relpath":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/prompt-preparer.yaml","source":"aftrmeet","mtimeMin":5624,"yaml":"# Prompt Preparer Agent\n#\n# Description + visual context → structured prompt with key frames.\n# Generates: title, actionable prompt, key frame timestamps.\n#\n# The host app records screen + mic, transcribes audio via the STT agent,\n# then sends the transcript here for structured prompt generation.\n#\n# Requires: openmirai-engine >= v0.7.0 (output_schema como string JSON)\n\nname: prompt-preparer\nversion: v1\ndescription: \"Generate structured prompts from problem description\"\n\ninputs:\n  description:\n    type: text\n    required: true\n    description: \"Transcribed audio description of the problem\"\n  video_path:\n    type: file\n    required: false\n    description: \"Screen recording (.mov, video+audio merged, cursor visible) of the session\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: generate\n      tool_type: ai/llm_call\n      config:\n        model: \"gemini-2.5-flash\"\n        prompt: |\n          Eres un ingeniero de prompts que hace TRIAGE de un producto digital. Un usuario grabó\n          su PANTALLA (video, ~4 FPS, con el CURSOR/MOUSE visible) mientras narraba con su voz un\n          problema que tiene o un feature que quiere. Recibes: (1) la GRABACIÓN DE PANTALLA real\n          como video —que INCLUYE su voz en la pista de audio, sincronizada con la imagen— (o, si\n          era muy grande, fotogramas muestreados con sus timestamps), y (2) la transcripción de esa\n          voz [description]. Escucha el audio del video Y lee la transcripción: se complementan.\n\n          LA VOZ DEL USUARIO ES SU INTENCIÓN: lo que le molesta, lo que NO le gusta o lo que\n          necesita. El VIDEO es la EVIDENCIA de lo que señala en pantalla. Tu prompt debe capturar\n          ESE sentimiento/intención del usuario, anclado a la evidencia visual del video.\n\n          TU TRABAJO: generar un prompt AUTOCONTENIDO que el usuario pegará directo en una sesión\n          de un agente de código (Claude u otro). Ese agente NO verá el video ni oirá el audio:\n          TODO el contexto relevante debe quedar escrito en el texto.\n\n          CÓMO USAR EL VIDEO (crítico):\n          - MIRA los pixeles, no solo el transcript. Cita textos exactos, mensajes de error,\n            nombres de botones/campos, estados de UI, código o rutas visibles.\n          - SIGUE EL CURSOR. El mouse es el puntero de atención: cuando dice \"acá\", \"esto\",\n            \"este botón\", \"aquí falla\", correlaciona ESE momento del audio con DÓNDE está el\n            cursor y sobre QUÉ elemento. Descríbelo por nombre/ubicación (\"el botón Guardar arriba\n            a la derecha\", \"el tercer ítem de la lista\"), no como coordenadas.\n          - USA LA LÍNEA DE TIEMPO. Voz y pantalla están sincronizadas: lo que se dice en el\n            segundo N corresponde a lo que se ve en el segundo N.\n\n          REGLA DE ORO — FIDELIDAD ABSOLUTA: solo lo que se VIO y se DIJO. Prohibido inventar\n          rutas, nombres, errores o funciones que no aparezcan. Si algo no es visible ni se dijo,\n          no lo pongas (o márcalo \"no visible en la grabación\").\n\n          TIPIFICA primero: ¿PROBLEMA (algo roto) o FEATURE (algo que quiere agregar)? Estructura:\n          Contexto (qué app/vista se ve) · Problema o Feature (en sus palabras) · Evidencia en\n          pantalla (errores, textos, UI, código, rutas vistas; y qué señalaba el cursor en cada\n          momento clave) · Lo que quiere y lo que NO quiere · Criterio de éxito.\n\n          keyFrames: timestamps (segundos, dentro de la duración real) de los momentos que\n          REALMENTE viste y que un dev querría mirar, cada uno con su description. SÉ GENEROSO:\n          el agente que recibe el prompt SOLO ve estas imágenes fijas (no el video ni el audio),\n          así que dale GRANULARIDAD. Emite un keyFrame por cada momento visual significativo —\n          cada cambio de pantalla/vista, cada error que aparece, cada elemento que el cursor\n          señala, cada estado de UI relevante y cada paso de una acción. Como referencia: apunta a\n          ~1 keyFrame cada 8-12 segundos de grabación y, para una sesión de varios minutos, no\n          menos de ~10-15 en total (más si de verdad pasan más cosas). No los inventes ni\n          dupliques cuadros idénticos; pero ante la duda, incluye el momento — más contexto visual\n          es mejor para el dev.\n\n          Escribe en el MISMO idioma que la description. Devuelve UN objeto JSON con exactamente:\n          title (máx 80 chars), prompt, keyFrames.\n        temperature: 0\n        max_tokens: 65536\n        # OpenMirai 0.7.0: la validación estricta de config del tool ai/llm_call declara\n        # output_schema como STRING (JSON Schema serializado). Un objeto YAML inline es\n        # rechazado en runtime (\"expected type string, got object\") → va como bloque JSON.\n        output_schema: |\n          {\n            \"type\": \"object\",\n            \"properties\": {\n              \"title\": { \"type\": \"string\" },\n              \"prompt\": { \"type\": \"string\" },\n              \"keyFrames\": {\n                \"type\": \"array\",\n                \"items\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                    \"timestampSeconds\": { \"type\": \"number\" },\n                    \"description\": { \"type\": \"string\" }\n                  },\n                  \"required\": [\"timestampSeconds\", \"description\"]\n                }\n              }\n            },\n            \"required\": [\"title\", \"prompt\", \"keyFrames\"]\n          }\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: generate\n      data_map:\n        context: \"start.user_input\"\n        media_path: \"start.payload.video_path\"\n\n    - source: generate\n      target: respond\n"},{"id":"tts","path":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/tts.yaml","relpath":"/Users/gabo/Documents/Herramientas/Aftrmeet/agents/tts.yaml","source":"aftrmeet","mtimeMin":67350,"yaml":"# Text-to-Speech Preprocessing Agent\n#\n# Text → optimized text for natural speech synthesis.\n# Expands abbreviations, adds natural pauses, fixes grammar.\n# Actual audio synthesis happens in the host app (platform-specific).\n#\n# Requires: datamirai-engine >= v0.5.0\n\nname: tts\nversion: v1\ndescription: \"Preprocess text for natural speech synthesis\"\n\ninputs:\n  text:\n    type: text\n    required: true\n    description: \"Text to prepare for speech\"\n  voice:\n    type: text\n    required: false\n    default: \"Kore\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    - id: preprocess\n      tool_type: ai/llm_call\n      config:\n        model: \"gemini-2.5-flash\"\n        prompt: |\n          Prepare the following text for text-to-speech synthesis.\n          Make it sound natural when spoken aloud:\n          - Expand abbreviations (e.g., \"resp.\" → \"response\", \"avg.\" → \"average\")\n          - Add natural pauses via commas where appropriate\n          - Fix any grammar or punctuation issues\n          - Keep the original language and meaning\n          - Output ONLY the prepared text, nothing else\n        temperature: 0.2\n        max_tokens: 65536\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: preprocess\n      data_map:\n        context: \"start.user_input\"\n\n    - source: preprocess\n      target: respond\n"},{"id":"cerrar-y-reportar","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/orquestador/cerrar-y-reportar.yaml","relpath":"agents/orquestador/cerrar-y-reportar.yaml","source":"orquestador","mtimeMin":0,"yaml":"# Orquestador Mirai — Cerrar y reportar (agente termina -> recoge, reporta, actualiza tracking)\n#\n#   agente_id -> recoger (mcp/call -> orquestador: GET /sessions/{id}/output = resultado final)\n#             -> destilar_reporte (LLM: BLUF -> TL;DR + detalle, metodo del centro)\n#             -> guardar_reporte (filesystem/write_file en workspace/<proyecto>/output/)\n#             -> parar_sesion (mcp/call -> orquestador: POST /sessions/{id}/stop) -> respond\n#\n# HONESTIDAD: recoger/parar_sesion modelan endpoints reales (output / stop). El reporte se\n# escribe con el estandar BLUF del centro (data-out). Lo que NO hace este grafo: tocar\n# dashboard/data.js ni commit+push (eso lo hace la sesion-centro con criterio). \"Actualizar\n# tracking\" aqui = dejar el reporte MD; el update del tablero es paso humano-asistido. En\n# vivo estos endpoints los llama la sesion-centro a mano; cablearlo por el motor = deck.\n#\n# Run:\n#   mirai run agents/orquestador/cerrar-y-reportar.yaml --provider gemini --api-key $KEY \\\n#     --input '{\"agente_id\":\"sapilabs-plataforma\",\"proyecto\":\"sapilabs\",\n#               \"reporte_path\":\"workspace/sapilabs/output/2026-07-27-cierre-sesion.md\"}'\n# Validar:\n#   mirai validate agents/orquestador/cerrar-y-reportar.yaml\n\nname: orquestador-cerrar-y-reportar\nversion: v1\ndescription: \"Cierra una sesion terminada: recoge su resultado final, destila un reporte BLUF (data-out del centro), lo guarda en output/ y para la sesion (POST /sessions/{id}/stop).\"\n\ninputs:\n  agente_id:\n    type: text\n    required: true\n    description: \"El id de la sesion/agente que termino\"\n  proyecto:\n    type: text\n    required: true\n    description: \"El tag/proyecto del centro al que pertenece (para la ruta de output/)\"\n  reporte_path:\n    type: text\n    required: false\n    default: \"workspace/centro/output/cierre-sesion.md\"\n    description: \"Ruta del reporte MD a generar (convencion YYYY-MM-DD-nombre)\"\n\noutputs:\n  reporte_guardado_en:\n    type: text\n    description: \"Ruta del reporte de cierre generado\"\n  parada:\n    type: json\n    description: \"Respuesta del orquestador al detener la sesion\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # PASO 1 — RECOGER el resultado final. Modela GET /sessions/{id}/output.\n    - id: recoger\n      tool_type: mcp/call\n      config:\n        server_name: mirai-orchestrator\n        tool_name: get_output\n\n    # PASO 2 — DESTILAR el reporte con el estandar BLUF del centro.\n    - id: destilar_reporte\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        temperature: 0.35\n        max_tokens: 2500\n        system_prompt: |\n          Eres el redactor de CIERRE del orquestador Mirai. Espanol, senior, BLUF: la decision\n          y el resultado ARRIBA (TL;DR escaneable), el detalle debajo de \"---\" y opcional.\n          Fuente de verdad: solo el resultado del agente. Celebra solo lo realmente terminado.\n        prompt: |\n          En el contexto recibes `resultado` -> lo ultimo que produjo el agente que termino.\n          Redacta el REPORTE DE CIERRE en Markdown con estructura BLUF:\n            # {titulo = veredicto de lo que se logro}\n            > proyecto: {proyecto} · fecha · tipo: cierre-sesion · que es (una frase)\n            ## TL;DR  (bullets: que quedo hecho / que sigue / que quedo abierto)\n            ---\n            ## Detalle  (que hizo el agente, evidencia, archivos tocados; NO repite el TL;DR)\n          Devuelve UNICAMENTE el Markdown, sin texto antes ni despues.\n\n    # PASO 3 — Guardar el reporte (data-out del loop del centro).\n    - id: guardar_reporte\n      tool_type: filesystem/write_file\n\n    # PASO 4 — PARAR la sesion. Modela POST /sessions/{id}/stop.\n    - id: parar_sesion\n      tool_type: mcp/call\n      config:\n        server_name: mirai-orchestrator\n        tool_name: stop_session\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    # data_map: cada value es UNA referencia JSONPath (string). El nodo mcp/call recibe el\n    # session_id suelto; el server de orquestacion lo usa en GET /sessions/{id}/output.\n    - source: start\n      target: recoger\n      data_map:\n        session_id: \"start.payload.agente_id\"\n\n    - source: recoger\n      target: destilar_reporte\n      data_map:\n        resultado: \"recoger.result\"\n        proyecto: \"start.payload.proyecto\"\n\n    - source: destilar_reporte\n      target: guardar_reporte\n      data_map:\n        content: \"destilar_reporte.response\"\n        path: \"start.payload.reporte_path\"\n\n    - source: guardar_reporte\n      target: parar_sesion\n      data_map:\n        session_id: \"start.payload.agente_id\"\n\n    - source: parar_sesion\n      target: respond\n      data_map:\n        reporte_guardado_en: \"guardar_reporte.path\"\n        parada: \"parar_sesion.result\"\n"},{"id":"crear-agente","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/orquestador/crear-agente.yaml","relpath":"agents/orquestador/crear-agente.yaml","source":"orquestador","mtimeMin":1,"yaml":"# Orquestador Mirai — Crear agente (spawn de sesion colgada del centro)\n#\n# Parametriza el POST /api/v1/orchestrator/sessions del motor OpenMirai (:4321).\n#   objetivo+proyecto -> preparar_brief (LLM afina objetivo y elige modelo/effort)\n#                     -> validar_ruta (existe la carpeta del proyecto?)\n#                     -> spawn (mcp/call -> orquestador: crea sesion tmux+claude)\n#                     -> respond (devuelve {id, tmux_session})\n#\n# HONESTIDAD: el nodo `spawn` modela la llamada real como un mcp/call al servidor de\n# orquestacion. En vivo, ese POST HOY lo hace la sesion-centro a mano (curl/fetch), como\n# se probo creando la sesion `sapilabs-plataforma`. Cablear que el MOTOR ejecute este nodo\n# contra su propia API de orquestacion es la integracion profunda del flywheel (ver deck).\n# Payload real del endpoint: {name?, project_dir, objective, model?, effort?, ultracode?}.\n#\n# Run:\n#   mirai run agents/orquestador/crear-agente.yaml --provider gemini --api-key $KEY \\\n#     --input '{\"objetivo\":\"Arrancar la web de SapiLabs en integracion-tati y validar en preview\",\n#               \"proyecto\":\"sapilabs\",\"project_dir\":\"/Users/gabo/Documents/Projects/Sapilabs-web\"}'\n# Validar:\n#   mirai validate agents/orquestador/crear-agente.yaml\n\nname: orquestador-crear-agente\nversion: v1\ndescription: \"Spawnea una sesion/agente colgada del centro: afina el objetivo, valida la ruta del proyecto y llama al endpoint de orquestacion (POST /sessions).\"\n\ninputs:\n  objetivo:\n    type: text\n    required: true\n    description: \"El objetivo ejecutable (0->1) que tendra el agente nuevo\"\n  proyecto:\n    type: text\n    required: true\n    description: \"El tag/proyecto del centro (sapilabs, datamirai, centro, ...)\"\n  project_dir:\n    type: text\n    required: true\n    description: \"Ruta absoluta del repo/carpeta donde correra la sesion (cwd del tmux+claude)\"\n  model:\n    type: text\n    required: false\n    default: \"opus\"\n    description: \"Modelo de la sesion nueva (opus por defecto = mejor recurso)\"\n  effort:\n    type: text\n    required: false\n    default: \"high\"\n    description: \"Nivel de esfuerzo (high/max) para la sesion nueva\"\n\noutputs:\n  sesion:\n    type: json\n    description: \"Respuesta del orquestador: {id, tmux_session} de la sesion creada\"\n  brief:\n    type: text\n    description: \"El objetivo afinado que se le paso a la sesion\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # PASO 1 — Afinar el brief. Modelo fuerte: el objetivo se gana la calidad.\n    - id: preparar_brief\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        temperature: 0.3\n        max_tokens: 700\n        system_prompt: |\n          Eres el nodo de SPAWN del orquestador Mirai. Trabajas SIEMPRE en espanol, senior,\n          directo. Preparas el brief con el que arranca una sesion-agente nueva del centro,\n          siguiendo el metodo Back to My Center (objetivo claro -> validaciones -> plan -> loop).\n        prompt: |\n          En el contexto recibes `objetivo` y `proyecto`. Redacta el BRIEF de arranque de la\n          sesion nueva: objetivo acotado 0->1 + las validaciones/criterios de aceptacion que\n          demostraran que se cumplio (Loop Engineering: las validaciones son el contrato) +\n          el primer paso ejecutable. Bullet-first, sin paja. Devuelve SOLO el brief listo para\n          pasar como `objective` del POST /sessions.\n\n    # PASO 2 — Validar que la carpeta del proyecto exista (evita spawnear en el vacio).\n    - id: validar_ruta\n      tool_type: filesystem/file_info\n\n    # PASO 3 — SPAWN. Modela el POST /api/v1/orchestrator/sessions.\n    # config: server_name + tool_name apuntan al servidor de orquestacion (:4321).\n    # arguments llega por data_map (project_dir, objective afinado, model, effort).\n    - id: spawn\n      tool_type: mcp/call\n      config:\n        server_name: mirai-orchestrator\n        tool_name: create_session\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: preparar_brief\n      data_map:\n        objetivo: \"start.payload.objetivo\"\n        proyecto: \"start.payload.proyecto\"\n\n    - source: start\n      target: validar_ruta\n      data_map:\n        path: \"start.payload.project_dir\"\n\n    # Fan-in a spawn: el brief afinado + los parametros arman los `arguments` del POST /sessions.\n    # Nota data_map: cada value es UNA referencia JSONPath (string). El nodo `spawn` (mcp/call)\n    # recibe cada campo del payload del POST como argumento suelto; el server de orquestacion\n    # los ensambla en el body {name, project_dir, objective, model, effort}. El validar_ruta\n    # corre antes en el mismo camino (dependencia de orden) para no spawnear en el vacio.\n    - source: preparar_brief\n      target: spawn\n      data_map:\n        objective: \"preparar_brief.response\"\n        project_dir: \"start.payload.project_dir\"\n        name: \"start.payload.proyecto\"\n        model: \"start.payload.model\"\n        effort: \"start.payload.effort\"\n\n    - source: validar_ruta\n      target: spawn\n      data_map:\n        ruta_existe: \"validar_ruta.exists\"\n\n    - source: spawn\n      target: respond\n      data_map:\n        sesion: \"spawn.result\"\n        brief: \"preparar_brief.response\"\n"},{"id":"crear-workflow","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/orquestador/crear-workflow.yaml","relpath":"agents/orquestador/crear-workflow.yaml","source":"orquestador","mtimeMin":2,"yaml":"# Orquestador Mirai — Crear workflow (graph-agent: un proceso hecho una vez -> plantilla YAML)\n#\n# El meta-workflow del flywheel: toma la DESCRIPCION de un proceso que ya se ejecuto a mano\n# y lo destila en un grafo YAML reusable de OpenMirai.\n#   descripcion -> disenar (LLM: descompone en nodos+edges validos del motor) -> generar_yaml\n#     (LLM: emite el YAML crudo) -> guardar (filesystem/write_file en agents/) -> respond\n#\n# HONESTIDAD: este grafo PRODUCE un archivo YAML; NO lo registra ni lo valida por si mismo.\n# Tras generarlo, hay que correr `mirai validate <ruta>` y `node visualizer/build-catalog.js`\n# para que aparezca en el Studio. Ese cierre (validar + registrar + reintentar si el YAML\n# sale invalido) HOY lo hace la sesion-centro; cablearlo como lazo automatico\n# (Loop Engineering: generar -> validar -> reintentar) es la integracion profunda (deck).\n#\n# Run:\n#   mirai run agents/orquestador/crear-workflow.yaml --provider gemini --api-key $KEY \\\n#     --input '{\"nombre\":\"onboarding-cliente\",\"descripcion\":\"Recibe datos de un cliente nuevo, infiere su marca, crea la empresa en la plataforma y agenda el kickoff\",\n#               \"salida_path\":\"agents/onboarding-cliente.yaml\"}'\n# Validar:\n#   mirai validate agents/orquestador/crear-workflow.yaml\n\nname: orquestador-crear-workflow\nversion: v1\ndescription: \"Graph-agent: convierte la descripcion de un proceso ejecutado una vez en un workflow YAML reusable de OpenMirai (disena el grafo, emite el YAML y lo guarda en agents/).\"\n\ninputs:\n  nombre:\n    type: text\n    required: true\n    description: \"Nombre/slug del workflow nuevo (sera el `name` del YAML)\"\n  descripcion:\n    type: text\n    required: true\n    description: \"Descripcion en lenguaje natural del proceso que se quiere plantillar\"\n  salida_path:\n    type: text\n    required: false\n    default: \"agents/generado.yaml\"\n    description: \"Ruta donde se escribe el YAML generado\"\n\noutputs:\n  workflow_guardado_en:\n    type: text\n    description: \"Ruta del YAML generado\"\n  diseno:\n    type: text\n    description: \"El diseno de nodos+edges que sustenta el YAML\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # PASO 1 — DISENAR. Descompone el proceso en nodos y edges validos del motor.\n    - id: disenar\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        temperature: 0.3\n        max_tokens: 1500\n        system_prompt: |\n          Eres el nodo DISENADOR del orquestador Mirai (un graph-agent). Trabajas SIEMPRE\n          en espanol. Conoces los tool_type reales del motor OpenMirai y solo usas esos:\n            trigger/manual, trigger/webhook, trigger/heartbeat, trigger/schedule,\n            ai/llm_call, ai/transcribe, ai/tts, ai/claude_code,\n            logic/condition, logic/switch, logic/loop, logic/wait, logic/human_input, logic/merge,\n            filesystem/read_file, filesystem/write_file, filesystem/file_info,\n            mcp/call, data/web_scrape, output/response.\n        prompt: |\n          En el contexto recibes `descripcion` -> un proceso hecho a mano. Disena el grafo:\n          lista los NODOS (id + tool_type + para que sirve) y los EDGES (source->target +\n          que data_map fluye). Un solo trigger de entrada y un output/response al final.\n          No inventes tool_types fuera de la lista. Devuelve SOLO el diseno en bullets.\n\n    # PASO 2 — GENERAR el YAML crudo a partir del diseno.\n    - id: generar_yaml\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        temperature: 0.1\n        max_tokens: 4000\n        system_prompt: |\n          Eres el nodo EMISOR de YAML del orquestador Mirai. Emites un spec de OpenMirai\n          VALIDO y renderizable: claves name/version/description/inputs/outputs/graph con\n          graph.nodes (id, tool_type, config?) y graph.edges (source, target, data_map?).\n        prompt: |\n          En el contexto recibes `nombre` y `diseno`. Emite el archivo YAML COMPLETO del\n          workflow, usando `nombre` como `name`, siguiendo EXACTAMENTE el formato de los\n          agentes de OpenMirai. Devuelve UNICAMENTE el YAML, sin ``` ni texto antes/despues.\n\n    # PASO 3 — Guardar el YAML en disco (en agents/ para que build-catalog lo tome).\n    - id: guardar\n      tool_type: filesystem/write_file\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: disenar\n      data_map:\n        descripcion: \"start.payload.descripcion\"\n\n    - source: disenar\n      target: generar_yaml\n      data_map:\n        nombre: \"start.payload.nombre\"\n        diseno: \"disenar.response\"\n\n    - source: generar_yaml\n      target: guardar\n      data_map:\n        content: \"generar_yaml.response\"\n        path: \"start.payload.salida_path\"\n\n    - source: guardar\n      target: respond\n      data_map:\n        workflow_guardado_en: \"guardar.path\"\n        diseno: \"disenar.response\"\n"},{"id":"delegar-tarea","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/orquestador/delegar-tarea.yaml","relpath":"agents/orquestador/delegar-tarea.yaml","source":"orquestador","mtimeMin":1,"yaml":"# Orquestador Mirai — Delegar tarea (manda instruccion a un agente vivo + monitorea)\n#\n#   agente_id+tarea -> componer (LLM redacta la instruccion clara) -> enviar (mcp/call ->\n#     orquestador: POST /sessions/{id}/send) -> esperar (logic/wait: da tiempo a procesar)\n#                    -> leer_salida (mcp/call -> orquestador: GET /sessions/{id}/output)\n#                    -> evaluar (LLM: quedo hecho? necesita atencion?) -> respond\n#\n# HONESTIDAD: enviar/leer_salida modelan los endpoints reales del orquestador\n# (send / output). En vivo, HOY los invoca la sesion-centro a mano. El wait es un poll\n# simple (1 tiro), no un lazo de reintento fino — para monitoreo continuo esta\n# supervisar-flota.yaml. Cablearlo por el motor = integracion profunda (ver deck).\n#\n# Run:\n#   mirai run agents/orquestador/delegar-tarea.yaml --provider gemini --api-key $KEY \\\n#     --input '{\"agente_id\":\"sapilabs-plataforma\",\"tarea\":\"Corre los tests E2E de la vista Agentes y reporta verde/rojo\"}'\n# Validar:\n#   mirai validate agents/orquestador/delegar-tarea.yaml\n\nname: orquestador-delegar-tarea\nversion: v1\ndescription: \"Delega una tarea a un agente/sesion vivo: compone la instruccion, la envia (POST /sessions/{id}/send), espera, lee la salida y evalua si quedo hecho o necesita atencion.\"\n\ninputs:\n  agente_id:\n    type: text\n    required: true\n    description: \"El id de la sesion/agente vivo al que se delega (ej sapilabs-plataforma)\"\n  tarea:\n    type: text\n    required: true\n    description: \"La tarea a delegar, en lenguaje natural\"\n  espera_seg:\n    type: number\n    required: false\n    default: 30\n    description: \"Segundos a esperar antes de leer la salida del agente (poll simple)\"\n\noutputs:\n  veredicto:\n    type: json\n    description: \"Evaluacion: {estado, necesita_atencion, resumen} tras leer la salida del agente\"\n  instruccion_enviada:\n    type: text\n    description: \"La instruccion exacta que se le mando al agente\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # PASO 1 — Componer la instruccion clara para el agente.\n    - id: componer\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-flash\n        temperature: 0.3\n        max_tokens: 600\n        system_prompt: |\n          Eres el nodo de DELEGACION del orquestador Mirai. Espanol, directo, senior.\n          Conviertes una tarea cruda en UNA instruccion accionable y sin ambiguedad para\n          un agente-sesion (Claude Code corriendo en un tmux del centro).\n        prompt: |\n          En el contexto recibes `tarea`. Redacta la instruccion que se enviara al agente:\n          objetivo claro + como sabremos que quedo (validacion) + que reportar de vuelta.\n          Bullet-first, breve. Devuelve SOLO la instruccion lista para enviar.\n\n    # PASO 2 — ENVIAR. Modela POST /api/v1/orchestrator/sessions/{id}/send.\n    - id: enviar\n      tool_type: mcp/call\n      config:\n        server_name: mirai-orchestrator\n        tool_name: send_message\n\n    # PASO 3 — Esperar a que el agente procese (poll simple).\n    - id: esperar\n      tool_type: logic/wait\n      config:\n        delay_seconds: 30\n\n    # PASO 4 — LEER SALIDA. Modela GET /api/v1/orchestrator/sessions/{id}/output.\n    - id: leer_salida\n      tool_type: mcp/call\n      config:\n        server_name: mirai-orchestrator\n        tool_name: get_output\n\n    # PASO 5 — Evaluar la salida: hecho? necesita atencion de Gabriel?\n    - id: evaluar\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        temperature: 0.2\n        max_tokens: 600\n        system_prompt: |\n          Eres el nodo EVALUADOR del orquestador Mirai. Espanol, escuetamente honesto.\n          Lees la salida cruda de un agente y decides su estado real, sin optimismo falso.\n        prompt: |\n          En el contexto recibes `salida` -> lo ultimo que produjo el agente. Evalua:\n            - `estado`: hecho | en_progreso | bloqueado | error.\n            - `necesita_atencion`: true si hay que escalar a Gabriel (bloqueo, duda, error).\n            - `resumen`: una frase con lo que paso.\n          Celebra SOLO lo realmente terminado. Devuelve SOLO el JSON del esquema.\n        output_schema: |\n          {\n            \"type\": \"object\",\n            \"properties\": {\n              \"estado\": {\"type\": \"string\", \"enum\": [\"hecho\", \"en_progreso\", \"bloqueado\", \"error\"]},\n              \"necesita_atencion\": {\"type\": \"boolean\"},\n              \"resumen\": {\"type\": \"string\"}\n            },\n            \"required\": [\"estado\", \"necesita_atencion\", \"resumen\"]\n          }\n        schema_retries: 2\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: componer\n      data_map:\n        tarea: \"start.payload.tarea\"\n\n    # data_map: cada value es UNA referencia JSONPath (string). El nodo mcp/call recibe cada\n    # campo suelto y el server de orquestacion los ensambla en el body del POST /sessions/{id}/send.\n    - source: componer\n      target: enviar\n      data_map:\n        session_id: \"start.payload.agente_id\"\n        message: \"componer.response\"\n\n    - source: enviar\n      target: esperar\n\n    - source: esperar\n      target: leer_salida\n      data_map:\n        session_id: \"start.payload.agente_id\"\n\n    - source: leer_salida\n      target: evaluar\n      data_map:\n        salida: \"leer_salida.result\"\n\n    - source: evaluar\n      target: respond\n      data_map:\n        veredicto: \"evaluar.structured_output\"\n        instruccion_enviada: \"componer.response\"\n"},{"id":"ingesta-y-enrutamiento","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/orquestador/ingesta-y-enrutamiento.yaml","relpath":"agents/orquestador/ingesta-y-enrutamiento.yaml","source":"orquestador","mtimeMin":4,"yaml":"# Orquestador Mirai — Ingesta y enrutamiento\n#\n# El \"cuello unico\" del centro: recibe UN pedido en lenguaje natural y decide que hacer con el.\n#   pedido -> triage (LLM clasifica intencion) -> switch (3 ramas exclusivas):\n#     crear_nuevo    -> hay que spawnear una sesion/agente para un objetivo net-new\n#     delegar        -> ya existe un agente/sesion que debe atender esto\n#     responder      -> se resuelve aqui mismo (respuesta directa, sin flota)\n#   -> respond (devuelve la decision estructurada + a donde enrutar)\n#\n# HONESTIDAD: este grafo DECIDE el enrutamiento; el spawn/delegacion real los ejecutan\n# los workflows hermanos (crear-agente.yaml / delegar-tarea.yaml). Aqui la salida es la\n# INTENCION + destino. Quien encadena esto con esos workflows hoy es la sesion-centro a mano;\n# cablearlo por el motor es el paso de integracion profunda (ver deck).\n#\n# Run:\n#   mirai run agents/orquestador/ingesta-y-enrutamiento.yaml --provider gemini --api-key $KEY \\\n#     --input '{\"pedido\":\"Necesito que alguien arranque la web de SapiLabs en la rama integracion-tati\"}'\n# Validar (sin key):\n#   mirai validate agents/orquestador/ingesta-y-enrutamiento.yaml\n\nname: orquestador-ingesta-y-enrutamiento\nversion: v1\ndescription: \"Cuello unico del centro: recibe un pedido en lenguaje natural, clasifica la intencion y enruta (crear nuevo / delegar a existente / responder directo).\"\n\ninputs:\n  pedido:\n    type: text\n    required: true\n    description: \"El pedido crudo de Gabriel en lenguaje natural (voz transcrita o texto)\"\n  flota:\n    type: text\n    required: false\n    default: \"(sin flota listada)\"\n    description: \"Resumen opcional de las sesiones/agentes vivos, para decidir si delegar a uno existente\"\n\noutputs:\n  decision:\n    type: json\n    description: \"Intencion clasificada + destino: {accion, proyecto, objetivo, agente_destino, razon}\"\n  ruta:\n    type: text\n    description: \"La rama tomada: crear_nuevo | delegar | responder\"\n\ngraph:\n  nodes:\n    - id: start\n      tool_type: trigger/manual\n\n    # PASO 1 — TRIAGE. Modelo rapido: clasifica la intencion y extrae el destino.\n    - id: triage\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-flash\n        temperature: 0.0\n        max_tokens: 500\n        system_prompt: |\n          Eres el nodo de INGESTA del orquestador Mirai, el cuello unico del centro de mando\n          de Gabriel. Trabajas SIEMPRE en espanol, directo. Tu unico trabajo es clasificar UN\n          pedido en lenguaje natural y decidir a donde enrutarlo. NO ejecutas nada tu mismo.\n        prompt: |\n          En el contexto recibes:\n            - `pedido` -> lo que pide Gabriel.\n            - `flota`  -> resumen de sesiones/agentes vivos (puede venir vacio).\n\n          Decide la `accion` de EXACTAMENTE esta lista:\n            - crear_nuevo -> requiere spawnear una sesion/agente net-new para un objetivo.\n            - delegar     -> ya hay un agente/sesion vivo que puede atenderlo (mira `flota`).\n            - responder   -> se resuelve con una respuesta directa, sin mover la flota.\n          `proyecto` = uno de: athens, sapilabs, datamirai, timeless, herramientas, centro,\n            personal, parqueaderos, startup-life, libros, legal (si nada encaja: centro).\n          `objetivo` = el objetivo ejecutable en una frase (0->1).\n          `agente_destino` = si accion=delegar, el id/nombre del agente vivo; si no, \"\".\n          `razon` = por que tomaste esa ruta, en una frase.\n          Devuelve SOLO el JSON del esquema.\n        output_schema: |\n          {\n            \"type\": \"object\",\n            \"properties\": {\n              \"accion\": {\"type\": \"string\", \"enum\": [\"crear_nuevo\", \"delegar\", \"responder\"]},\n              \"proyecto\": {\"type\": \"string\"},\n              \"objetivo\": {\"type\": \"string\"},\n              \"agente_destino\": {\"type\": \"string\"},\n              \"razon\": {\"type\": \"string\"}\n            },\n            \"required\": [\"accion\", \"proyecto\", \"objetivo\", \"razon\"]\n          }\n        schema_retries: 2\n\n    # PASO 2 — ENRUTAR. Switch exclusivo sobre `accion`: una sola rama sigue.\n    - id: enrutar\n      tool_type: logic/switch\n      config:\n        cases: [\"crear_nuevo\", \"delegar\", \"responder\"]\n        default_case: \"responder\"\n\n    # Rama A — marca que hay que spawnear (lo ejecuta crear-agente.yaml aguas abajo).\n    - id: preparar_creacion\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-flash-lite\n        temperature: 0.2\n        max_tokens: 300\n        prompt: |\n          Se decidio CREAR un agente/sesion nuevo. En el contexto tienes la decision de triage.\n          Redacta en una frase el mensaje-handoff para el workflow `crear-agente`\n          (objetivo + proyecto). Devuelve SOLO esa frase.\n\n    # Rama B — arma la instruccion de delegacion (lo ejecuta delegar-tarea.yaml).\n    - id: preparar_delegacion\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-flash-lite\n        temperature: 0.2\n        max_tokens: 300\n        prompt: |\n          Se decidio DELEGAR a un agente vivo. En el contexto tienes la decision de triage\n          (incluye `agente_destino`). Redacta la instruccion clara a enviarle a ese agente.\n          Devuelve SOLO la instruccion.\n\n    # Rama C — respuesta directa, sin tocar la flota.\n    - id: responder_directo\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        temperature: 0.4\n        max_tokens: 800\n        system_prompt: |\n          Eres el orquestador Mirai respondiendo directo. Espanol, senior, bullet-first,\n          sin walls of text. Fuente de verdad: solo el pedido.\n        prompt: |\n          El pedido se resuelve con una respuesta directa (no hay que mover la flota).\n          Responde el pedido de Gabriel de forma accionable y breve.\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: triage\n      data_map:\n        pedido: \"start.payload.pedido\"\n        flota: \"start.payload.flota\"\n\n    - source: triage\n      target: enrutar\n      data_map:\n        value: \"triage.response.accion\"\n\n    # El switch expone matched_case; cada rama filtra por su valor.\n    - source: enrutar\n      target: preparar_creacion\n      condition:\n        field: matched_case\n        op: equals\n        value: crear_nuevo\n\n    - source: enrutar\n      target: preparar_delegacion\n      condition:\n        field: matched_case\n        op: equals\n        value: delegar\n\n    - source: enrutar\n      target: responder_directo\n      condition:\n        field: matched_case\n        op: equals\n        value: responder\n\n    - source: preparar_creacion\n      target: respond\n      data_map:\n        decision: \"triage.structured_output\"\n        ruta: \"preparar_creacion.response\"\n\n    - source: preparar_delegacion\n      target: respond\n      data_map:\n        decision: \"triage.structured_output\"\n        ruta: \"preparar_delegacion.response\"\n\n    - source: responder_directo\n      target: respond\n      data_map:\n        decision: \"triage.structured_output\"\n        ruta: \"responder_directo.response\"\n"},{"id":"supervisar-flota","path":"/Users/gabo/Documents/Data Mirai/Apps/Engine/agents/orquestador/supervisar-flota.yaml","relpath":"agents/orquestador/supervisar-flota.yaml","source":"orquestador","mtimeMin":2,"yaml":"# Orquestador Mirai — Supervisar flota (vigila sesiones, detecta quien necesita atencion, escala)\n#\n#   heartbeat -> listar (mcp/call -> orquestador: GET /sessions) -> triage_flota (LLM: quien\n#     esta atascado / bloqueado / callado) -> hay_escalacion? (logic/condition)\n#       si -> escalar (logic/human_input: sube la duda/bloqueo a Gabriel  == canal ascendente)\n#       no -> respond directo (todo ok)\n#\n# HONESTIDAD: listar modela GET /sessions (real). El canal ASCENDENTE (escalar a Gabriel)\n# se modela con logic/human_input — el motor lo intercepta como un interrupt que espera\n# respuesta humana. HOY ese \"avisar a Gabriel\" lo hace la sesion-centro por chat/voz a mano;\n# que el motor dispare el interrupt y lo enrute a la app es la integracion profunda (deck).\n# El disparador es trigger/heartbeat (loop de vigilancia); correrlo periodico requiere el\n# scheduler del motor prendido.\n#\n# Run (one-shot, simulando un tick):\n#   mirai run agents/orquestador/supervisar-flota.yaml --provider gemini --api-key $KEY --input '{}'\n# Validar:\n#   mirai validate agents/orquestador/supervisar-flota.yaml\n\nname: orquestador-supervisar-flota\nversion: v1\ndescription: \"Vigila la flota de sesiones: lista los agentes vivos, detecta quien esta bloqueado/callado/en error y escala a Gabriel (canal ascendente) solo lo que lo necesita.\"\n\ninputs:\n  umbral_min:\n    type: number\n    required: false\n    default: 20\n    description: \"Minutos de silencio de una sesion tras los que se considera 'callada' (candidata a revisar)\"\n\noutputs:\n  reporte_flota:\n    type: json\n    description: \"Estado de la flota: [{agente, estado, necesita_atencion}] + a_escalar\"\n  escalado_a_gabriel:\n    type: text\n    description: \"Lo que se subio a Gabriel (o 'nada que escalar')\"\n\ngraph:\n  nodes:\n    # trigger/heartbeat: pensado para correr en loop (cada tick revisa la flota).\n    - id: start\n      tool_type: trigger/heartbeat\n\n    # PASO 1 — LISTAR. Modela GET /api/v1/orchestrator/sessions.\n    - id: listar\n      tool_type: mcp/call\n      config:\n        server_name: mirai-orchestrator\n        tool_name: list_sessions\n\n    # PASO 2 — Triage de la flota: quien necesita atencion.\n    - id: triage_flota\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-pro\n        temperature: 0.2\n        max_tokens: 900\n        system_prompt: |\n          Eres el nodo SUPERVISOR del orquestador Mirai, el que vigila la oficina agentica\n          24/7. Espanol, honesto, sin alarmar de mas. Tu trabajo: mirar la flota y decir\n          quien esta OK y quien necesita atencion humana (bloqueo, duda, error, o callado).\n        prompt: |\n          En el contexto recibes `flota` -> la lista cruda de sesiones vivas (id, estado,\n          ultima actividad) y `umbral_min` -> minutos de silencio para marcar \"callada\".\n          Para cada sesion decide su `estado` y si `necesita_atencion`. Ademas produce\n          `a_escalar`: el resumen (1-3 bullets) de lo que hay que subir a Gabriel AHORA;\n          si nada lo necesita, pon a_escalar = \"\" y hay_escalacion = false.\n          Devuelve SOLO el JSON del esquema.\n        output_schema: |\n          {\n            \"type\": \"object\",\n            \"properties\": {\n              \"sesiones\": {\n                \"type\": \"array\",\n                \"items\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                    \"agente\": {\"type\": \"string\"},\n                    \"estado\": {\"type\": \"string\"},\n                    \"necesita_atencion\": {\"type\": \"boolean\"}\n                  },\n                  \"required\": [\"agente\", \"estado\", \"necesita_atencion\"]\n                }\n              },\n              \"hay_escalacion\": {\"type\": \"boolean\"},\n              \"a_escalar\": {\"type\": \"string\"}\n            },\n            \"required\": [\"sesiones\", \"hay_escalacion\", \"a_escalar\"]\n          }\n        schema_retries: 2\n\n    # PASO 3 — Hay algo que escalar? (condicion sobre hay_escalacion)\n    - id: check_escalacion\n      tool_type: logic/condition\n      config:\n        operator: equals\n        value: true\n\n    # Rama SI — CANAL ASCENDENTE: sube la duda/bloqueo a Gabriel y espera su decision.\n    - id: escalar\n      tool_type: logic/human_input\n      config:\n        prompt: \"El orquestador Mirai detecto sesiones que necesitan tu atencion. Revisa y decide.\"\n        timeout_minutes: 120\n\n    # Rama NO — todo en orden, no molestar a Gabriel.\n    - id: sin_novedad\n      tool_type: ai/llm_call\n      config:\n        model: gemini-2.5-flash-lite\n        temperature: 0.0\n        max_tokens: 120\n        prompt: |\n          La flota esta OK, no hay nada que escalar. Devuelve UNA linea de estado\n          (\"Flota estable: N sesiones, nada que escalar\") usando el contexto.\n\n    - id: respond\n      tool_type: output/response\n\n  edges:\n    - source: start\n      target: listar\n\n    - source: listar\n      target: triage_flota\n      data_map:\n        flota: \"listar.result\"\n        umbral_min: \"start.payload.umbral_min\"\n\n    - source: triage_flota\n      target: check_escalacion\n      data_map:\n        field: \"triage_flota.response.hay_escalacion\"\n\n    - source: check_escalacion\n      target: escalar\n      condition:\n        field: result\n        op: equals\n        value: true\n\n    - source: check_escalacion\n      target: sin_novedad\n      condition:\n        field: result\n        op: equals\n        value: false\n\n    - source: escalar\n      target: respond\n      data_map:\n        reporte_flota: \"triage_flota.structured_output\"\n        escalado_a_gabriel: \"escalar.response\"\n\n    - source: sin_novedad\n      target: respond\n      data_map:\n        reporte_flota: \"triage_flota.structured_output\"\n        escalado_a_gabriel: \"sin_novedad.response\"\n"}];</script>

function deriveCat(tt){if(!tt)return 'data';var ns=String(tt).split('/')[0];

function inferType(name){name=(name||'').toLowerCase();
  if(/content|text|prompt|context|summary|response|answer|notes|brief|report/.test(name))return 'text';

  if(/result|ok|valid|done/.test(name))return 'bool';if(/payload/.test(name))return 'json';return 'any';}

  if(n.tool==='data/web_scrape')return 'text';if(n.tool==='filesystem/read_file')return 'content';return 'out';}

  Object.keys(cfg).forEach(function(k){var v=cfg[k],s;if(v==null)s='';else if(typeof v==='object')s=JSON.stringify(v);else s=String(v);
    s=s.replace(/\s+/g,' ').trim();if(s.length>72)s=s.slice(0,71)+'…';out.push({k:k,v:s});});return out;}

function layerStages(nodes,edges){var byId={};nodes.forEach(function(n){byId[n.id]=n;n.stage=0;});

  var byId={};nodes.forEach(function(n){byId[n.id]=n;});
  function ensurePort(node,arr,name){if(!node||name==null)return;name=String(name);if(!node[arr].some(function(p){return p.n===name;}))node[arr].push({n:name,t:inferType(name)});}

  rawEdges.forEach(function(e){var S=byId[e.source],T=byId[e.target];if(!S||!T)return;var toPort=null,fromPort=null;
    if(e.data_map&&typeof e.data_map==='object'){var keys=Object.keys(e.data_map);
      keys.forEach(function(k){ensurePort(T,'inputs',k);var toks=String(e.data_map[k]).split('.');var sn=byId[toks[0]];var sp=toks.slice(1).join('.')||'out';if(sn)ensurePort(sn,'outputs',sp);if(toks[0]===e.source&&!fromPort)fromPort=sp;});

    }else if(e.condition&&typeof e.condition==='object'){fromPort=e.condition.field||'result';ensurePort(S,'outputs',fromPort);toPort='in';ensurePort(T,'inputs',toPort);}

    nodes:nodes,edges:edges,sample:{},runs:[],lastOpenedMinAgo:(meta.mtimeMin!=null?meta.mtimeMin:99999),

/* ================= GRAPH ================= */
var G={HEAD:46,PADTOP:2,GRP:21,ROW:27,PADBOT:8,STAGETOP:30};

function outY(n,name){var j=Math.max(0,n.outputs.findIndex(function(p){return p.n===name;}));var inB=n.inputs.length?G.GRP+n.inputs.length*G.ROW:0;return G.HEAD+G.PADTOP+inB+G.GRP+j*G.ROW+G.ROW/2;}

  A.nodes.forEach(function(n){if(order.indexOf(n.id)<0)order.push(n.id);});return order;}

function nodeDoes(n){var t=n.tool||'';var rc=n.rawConfig||{};
  var M={
    'trigger/manual':'Punto de entrada: recibe el input del usuario y arranca el flujo.',
    'trigger/webhook':'Punto de entrada: se dispara al recibir una petición HTTP externa.',
    'ai/llm_call':'Llama a un modelo de lenguaje con un prompt para razonar/generar texto.',
    'ai/transcribe':'Transcribe audio a texto (y diariza por hablante si aplica).',
    'ai/image_edit':'Edita o genera una imagen con un modelo visual.',
    'data/web_scrape':'Extrae el contenido de una URL de la web.',
    'data/read_file':'Lee un archivo del disco y expone su contenido.',
    'filesystem/read_file':'Lee un archivo del disco y expone su contenido.',
    'data/write_file':'Escribe el resultado en un archivo del disco.',
    'filesystem/write_file':'Escribe el resultado en un archivo del disco.',
    'transform/condition':'Bifurca el flujo según una condición sobre los datos.',
    'logic/condition':'Bifurca el flujo según una condición sobre los datos.',
    'output/response':'Devuelve la respuesta final del workflow.'
  };
  if(M[t])return M[t];
  var ns=String(t).split('/')[0];
  if(ns==='ai')return 'Paso de IA ('+t+').';
  if(ns==='data'||ns==='filesystem')return 'Paso de datos ('+t+').';
  if(ns==='trigger')return 'Disparador del flujo ('+t+').';
  if(ns==='output')return 'Salida del flujo ('+t+').';
  if(ns==='transform'||ns==='logic')return 'Lógica de control ('+t+').';
  return 'Paso '+t+'.';}

        '<span class="btn ghost sm" style="pointer-events:none">'+svgIcon('layers',13,false)+'Canvas</span></div>'+
      '<div class="card-desc" style="min-height:0;margin-bottom:9px">'+esc(a.description)+'</div>'+
      '<span class="label" style="display:block;margin-bottom:5px">modelos que usa</span><div class="wfrow-models">'+modelH+'</div></div>';}).join('');
  var runRows=runs.length?runs.slice(0,12).map(function(x){var r=x.run,a=x.agent;var cls=r.status==='success'?'ok':'err';
    return '<tr data-goto="#/agent/'+a.id+'"><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="dot '+cls+'"></span>'+r.status+'</span></td><td>'+esc(a.name)+'</td><td>'+agoStr(r.tMinAgo)+'</td><td>'+r.durationSec+'s</td><td>'+esc(r.summary)+'</td></tr>';}).join(''):
    '<tr><td colspan="5" style="color:var(--text-3)">Sin ejecuciones — corre uno de sus workflows con <code style="font-family:var(--font-mono)">mirai run</code>.</td></tr>';
  $('#content').innerHTML='<div class="page">'+
    '<div style="margin-bottom:14px"><a class="navitem" href="#/agents" style="display:inline-flex;padding:5px 10px 5px 6px;margin:0;font-size:12.5px">'+svgIcon('back',15,false)+'Agentes</a></div>'+
    '<div class="dh"><span class="dh-ico" style="background:color-mix(in srgb,'+col+' 13%,var(--surface));color:'+col+';border-color:color-mix(in srgb,'+col+' 28%,transparent)">'+svgIcon('persona',26,false)+'</span>'+
    '<div style="flex:1;min-width:0;padding-top:2px"><h1 class="page-h" style="margin:0">'+esc(idn.name)+'</h1>'+
    '<div class="card-id" style="margin-top:4px">identidad · combina '+idn.workflows.length+' workflows</div><p style="font-size:13.5px;color:var(--text-2);margin:9px 0 0;max-width:660px;line-height:1.55">'+esc(idn.persona)+'</p></div></div>'+
    '<div class="metabar"><div class="mb"><span class="mb-k">Workflows</span><span class="mb-v">'+idn.workflows.length+'</span></div><div class="mb"><span class="mb-k">Ejecuciones</span><span class="mb-v">'+runs.length+'</span></div><div class="mb"><span class="mb-k">Exitosas</span><span class="mb-v">'+runs.filter(function(x){return x.run.status==="success";}).length+'</span></div></div>'+
    '<div class="section-h">Workflows a los que tiene acceso <span class="cnt">· modelo y config · click para abrir el paso a paso</span></div><div class="grid">'+wfCards+'</div>'+
    '<div class="section-h">Ejecuciones del agente <span class="cnt">· todos sus workflows</span></div><table class="rtable"><thead><tr><th>Estado</th><th>Workflow</th><th>Cuando</th><th>Duracion</th><th>Resumen</th></tr></thead><tbody>'+runRows+'</tbody></table></div>';
  paintIcons($('#content'));wireGoto();}

/* ================= OBSERVABILIDAD (ejecuciones · resultados · trazabilidad) ================= */
function renderObservability(){var runs=allRuns();
  var runs24=runs.filter(function(x){return x.run.tMinAgo<1440;}).length;
  var okAll=runs.filter(function(x){return x.run.status==='success';}).length;
  var errAll=runs.length-okAll;var rate=runs.length?Math.round(okAll/runs.length*100)+'%':'—';
  var avg=runs.length?Math.round(runs.reduce(function(s,x){return s+(x.run.durationSec||0);},0)/runs.length):0;
  var tiles='<div class="tiles">'+
    '<div class="tile"><div class="tile-k">Ejecuciones 24h</div><div class="tile-v">'+runs24+'</div></div>'+
    '<div class="tile"><div class="tile-k">Tasa de exito</div><div class="tile-v">'+rate+'</div></div>'+
    '<div class="tile"><div class="tile-k">Errores</div><div class="tile-v">'+errAll+'</div></div>'+
    '<div class="tile"><div class="tile-k">Duracion media</div><div class="tile-v">'+avg+'s</div></div></div>';
  var rows=runs.length?runs.map(function(x){var r=x.run,a=x.agent;var cls=r.status==='success'?'ok':'err';
    return '<tr data-goto="#/agent/'+a.id+'"><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="dot '+cls+'"></span>'+r.status+'</span></td><td style="font-weight:600">'+esc(a.name)+'</td><td>'+agoStr(r.tMinAgo)+'</td><td>'+r.durationSec+'s</td><td style="color:var(--text-2)">'+esc(r.summary)+'</td></tr>';}).join(''):
    '<tr><td colspan="5" style="color:var(--text-3)">Aun no hay ejecuciones registradas. Corre un workflow con <code style="font-family:var(--font-mono)">mirai run agents/&lt;id&gt;.yaml</code> — las trazas aparecen aqui (fuente: <code>runs.local.json</code>).</td></tr>';
  $('#content').innerHTML='<div class="page"><h1 class="page-h">Observabilidad</h1><p class="page-sub">Ejecuciones · resultados · trazabilidad de todos los workflows y agentes. Click en una fila para abrir su workflow.</p>'+
    tiles+'<div class="section-h">Trazabilidad de ejecuciones <span class="cnt">· '+runs.length+' registradas</span></div>'+
    '<table class="rtable"><thead><tr><th>Estado</th><th>Workflow</th><th>Cuando</th><th>Duracion</th><th>Resultado</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  paintIcons($('#content'));wireGoto();}

function renderDetail(id){var a=agentById(id);if(!a){location.hash='#/workflows';return;}markOpened(a);
  var col=a.accent||tagColor(a.tag);var order=topoOrder(a);
  var flow=order.map(function(nid,i){var n=a.nodes.filter(function(x){return x.id===nid;})[0];if(!n)return '';var c=CAT[n.cat]||CAT.data;
    return (i?'<span class="fm-arrow">'+svgIcon('arrow',15,false)+'</span>':'')+'<span class="fm-node" style="background:color-mix(in srgb,'+c.tint+' 10%,var(--surface));color:'+c.tint+';border-color:color-mix(in srgb,'+c.tint+' 28%,transparent)">'+svgIcon(c.ico,13,false)+esc(n.id)+'</span>';}).join('');
  var dir=a.path?a.path.replace(/\/[^\/]*$/,''):null;
  var pathbar=a.path?('<div class="pathbar"><span data-ico="file" style="color:var(--text-3)"></span><code class="ppath" title="'+esc(a.path)+'">'+esc(a.path)+'</code>'+
      '<button class="btn ghost sm" data-copy="'+esc(a.path)+'"><span data-ico="copy"></span>Copiar ruta</button>'+
      '<a class="btn ghost sm" href="file://'+encPath(dir)+'" target="_blank"><span data-ico="folder"></span>Abrir carpeta</a>'+
      '<a class="btn ghost sm" href="file://'+encPath(a.path)+'" target="_blank"><span data-ico="link"></span>Abrir .yaml</a></div>'):
    (a.external?'<div class="pathbar"><span data-ico="file" style="color:var(--text-3)"></span><code class="ppath">'+esc(a.relpath||'archivo')+'</code><span class="ext-note">abierto desde archivo — por seguridad el navegador no expone la ruta absoluta</span></div>':'');
  var rows=(a.runs||[]).map(function(r){var cls=r.status==='success'?'ok':'err';return '<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="dot '+cls+'"></span>'+r.status+'</span></td><td>'+agoStr(r.tMinAgo)+'</td><td>'+r.durationSec+'s</td><td>'+esc(r.summary)+'</td></tr>';}).join('');
  $('#content').innerHTML='<div class="page">'+
    '<div style="margin-bottom:14px"><a class="navitem" href="#/workflows" style="display:inline-flex;padding:5px 10px 5px 6px;margin:0;font-size:12.5px">'+svgIcon('back',15,false)+'Workflows</a></div>'+
    '<div class="dh"><span class="dh-ico" style="background:color-mix(in srgb,'+col+' 13%,var(--surface));color:'+col+';border-color:color-mix(in srgb,'+col+' 28%,transparent)">'+svgIcon(a.icon||'agent',26,false)+'</span>'+
    '<div style="flex:1;min-width:0;padding-top:2px"><div style="display:flex;align-items:center;gap:10px"><h1 class="page-h" style="margin:0">'+esc(a.name)+'</h1><span class="badge" style="background:color-mix(in srgb,'+tagColor(a.tag)+' 12%,var(--surface));color:'+tagColor(a.tag)+';border-color:color-mix(in srgb,'+tagColor(a.tag)+' 30%,transparent)">'+esc(a.tag)+'</span></div>'+
    '<div class="card-id" style="margin-top:4px">'+esc(a.id)+'.yaml · '+esc(a.category||'')+'</div><p style="font-size:13.5px;color:var(--text-2);margin:9px 0 0;max-width:660px;line-height:1.55">'+esc(a.description)+'</p></div>'+
    '<div class="dh-actions"><button class="btn secondary big" data-goto="#/agent/'+a.id+'/canvas" data-yaml="1"><span data-ico="code"></span>Ver YAML</button><button class="btn primary big" data-goto="#/agent/'+a.id+'/canvas"><span data-ico="layers"></span>Abrir en canvas</button></div></div>'+
    pathbar+
    '<div class="metabar"><div class="mb"><span class="mb-k">Nodos</span><span class="mb-v">'+a.nodes.length+'</span></div><div class="mb"><span class="mb-k">Edges</span><span class="mb-v">'+a.edges.length+'</span></div><div class="mb"><span class="mb-k">Etapas</span><span class="mb-v">'+((a._maxStage!=null?a._maxStage:Math.max.apply(null,a.nodes.map(function(n){return n.stage;})))+1)+'</span></div><div class="mb"><span class="mb-k">Ultima apertura</span><span class="mb-v">'+agoFromTs(openedAt(a))+'</span></div></div>'+
    '<div class="section-h">Flujo <span class="cnt">· '+a.nodes.length+' pasos</span></div><div class="flowmini wrap">'+flow+'</div>'+
    '<div class="section-h">Paso a paso <span class="cnt">· qué hace cada nodo y su config</span></div>'+stepHTML(a)+
    '<div class="section-h">Ejecuciones</div><table class="rtable"><thead><tr><th>Estado</th><th>Cuando</th><th>Duracion</th><th>Resumen</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" style="color:var(--text-3)">Sin ejecuciones registradas — corre <code style="font-family:var(--font-mono)">mirai run</code> para verlas aqui.</td></tr>')+'</tbody></table></div>';
  paintIcons($('#content'));wireGoto();
  $('#content').querySelectorAll('[data-copy]').forEach(function(el){el.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();var p=el.dataset.copy;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p).then(function(){toast('Copiado','ruta al portapapeles');});}else toast('Copiar',p);});});}
function wireGoto(){$('#content').querySelectorAll('[data-goto]').forEach(function(el){el.addEventListener('click',function(ev){if(ev.target.closest('[data-copy]')||ev.target.closest('a[href^="file:"]'))return;ev.preventDefault();window._pendingYaml=el.dataset.yaml==='1';location.hash=el.dataset.goto;});});}

/* ================= OPEN FROM ANY PATH ================= */
function handleFiles(files){if(typeof window.jsyaml==='undefined'){toast('Falta js-yaml','Corre build-catalog.js para habilitar el parser');return;}
  Array.prototype.forEach.call(files,function(f){var r=new FileReader();
    r.onload=function(){try{var y=window.jsyaml.load(r.result);var id=f.name.replace(/\.(ya?ml)$/i,'');var m=SRCMETA.externo;
      var a=convertYamlToAgent(y,{id:id,source:'externo',external:true,relpath:f.name,tag:m.tag,icon:m.icon,accent:m.accent,category:m.category,mtimeMin:Math.round((Date.now()-(f.lastModified||Date.now()))/60000)});
      a._yaml=r.result;CATALOG=CATALOG.filter(function(x){return x.id!==a.id;});CATALOG.push(a);recents[a.id]=Date.now();saveRecents();
      toast('Agente abierto',a.name+' — asociado al visualizador local');location.hash='#/agent/'+a.id;
    }catch(e){toast('No se pudo leer',f.name+': '+e.message);}};r.readAsText(f);});}

/* ================= NAV / ROUTER ================= */
function setNav(w){$('#navHome').classList.toggle('active',w==='home');$('#navWorkflows').classList.toggle('active',w==='workflows');$('#navAgentsView').classList.toggle('active',w==='agents');$('#navObs').classList.toggle('active',w==='obs');}
function showShell(){$('#shell').style.display='flex';$('#editor').style.display='none';}
function openCanvas(id){var a=agentById(id);if(!a){location.hash='#/workflows';return;}markOpened(a);
  $('#shell').style.display='none';$('#editor').style.display='flex';buildEditor(a);
  if(window._pendingYaml){var y=$('#modeSeg').querySelector('button[data-mode="YAML"]');if(y)y.click();window._pendingYaml=false;}}
function route(){var h=location.hash.slice(1)||'/';var m;
  if(h==='/'||h==='/home'){showShell();setNav('home');renderHome();}
  else if(h==='/workflows'){showShell();setNav('workflows');renderCollection();}
  else if(h==='/agents'||h==='/agents-view'){showShell();setNav('agents');renderAgentsView();}
  else if((m=h.match(/^\/observability$/))){showShell();setNav('obs');renderObservability();}
  else if((m=h.match(/^\/identity\/([\w.-]+)$/))){showShell();setNav('agents');renderIdentity(m[1]);}
  else if((m=h.match(/^\/agent\/([\w.-]+)\/canvas$/))){openCanvas(m[1]);}
  else if((m=h.match(/^\/agent\/([\w.-]+)$/))){showShell();setNav('workflows');renderDetail(m[1]);}
  else{location.hash='#/';}}

/* ================= TOAST / THEME / INIT ================= */
function toast(title,msg){var el=document.createElement('div');el.className='toast';
  el.innerHTML='<span class="toast-ico">'+svgIcon('check',15,false)+'</span><div style="flex:1"><div style="font-size:12.5px;font-weight:600">'+esc(title)+'</div><div style="font-size:11.5px;color:var(--text-2);margin-top:2px">'+esc(msg)+'</div></div>';
  $('#toasts').appendChild(el);setTimeout(function(){el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(function(){el.remove();},300);},2800);}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('mirai_theme',t);}catch(e){}
  var ic=t==='dark'?'sun':'moon';var et=$('#edTheme');if(et){et.innerHTML=svgIcon(ic,18,false);et.dataset.done='1';}
  $('#navTheme').innerHTML='<span style="display:inline-flex">'+svgIcon(ic,17,false)+'</span>'+(t==='dark'?'Tema claro':'Tema oscuro');}
function init(){
  $('#navHome').innerHTML='<span style="display:inline-flex">'+svgIcon('home',17,false)+'</span>Inicio';
  $('#navWorkflows').innerHTML='<span style="display:inline-flex">'+svgIcon('flow',17,false)+'</span>Workflows';
  $('#navAgentsView').innerHTML='<span style="display:inline-flex">'+svgIcon('persona',17,false)+'</span>Agentes';
  $('#navObs').innerHTML='<span style="display:inline-flex">'+svgIcon('pulse',17,false)+'</span>Observabilidad';
  var savedT='light';try{savedT=localStorage.getItem('mirai_theme')||'light';}catch(e){}
  paintIcons(document);setTheme(savedT);
  $('#navTheme').addEventListener('click',function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');});
  $('#edTheme').addEventListener('click',function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');});
  $('#edBack').addEventListener('click',function(){location.hash='#/agent/'+curAgent.id;});
  $('#modeSeg').querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){$('#modeSeg').querySelectorAll('button').forEach(function(x){x.classList.remove('active');});b.classList.add('active');showYAML(b.dataset.mode==='YAML');});});
  $('#copyYaml').addEventListener('click',function(){var y=curAgent._yaml||toYAML(curAgent);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(y).then(function(){toast('Copiado',curAgent.id+'.yaml al portapapeles');});}else toast('Copiar','Selecciona el texto');});
  $('#edRun').addEventListener('click',runAgent);
  $('#fitBtn').addEventListener('click',function(){zoom=null;renderGraph();});
  $('#fitBtn2').addEventListener('click',function(){zoom=null;renderGraph();});
  $('#zoomIn').addEventListener('click',function(){zoom=(zoom||currentScale())*1.15;renderGraph();});
  $('#zoomOut').addEventListener('click',function(){zoom=(zoom||currentScale())*0.87;renderGraph();});
  $('#openAgentBtn').addEventListener('click',function(){$('#filePick').click();});
  $('#filePick').addEventListener('change',function(ev){if(ev.target.files&&ev.target.files.length)handleFiles(ev.target.files);ev.target.value='';});
  window.addEventListener('resize',function(){if($('#editor').style.display!=='none'&&curAgent)renderGraph();});
  window.addEventListener('hashchange',route);
  route();
}
init();
</script>
</body>
