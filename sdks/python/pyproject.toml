[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datamirai"
version = "0.5.2"
description = "Python SDK for Data Mirai Engine — agentic graph execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
all = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/gabo-the-creator/data-mirai-engine"
Repository = "https://github.com/gabo-the-creator/data-mirai-engine"
Issues = "https://github.com/gabo-the-creator/data-mirai-engine/issues"
Changelog = "https://github.com/gabo-the-creator/data-mirai-engine/blob/main/CHANGELOG.md"
